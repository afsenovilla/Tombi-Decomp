name: Assets extractor (Windows exe)

# Builds tools/extract_sprites.py into a single Windows executable with PyInstaller and commits it to
# dist/windows/tombi-assets.exe, so the sprite extractor can be used on a retail disc image without Python or the
# repository.  Runs when the extractor or the modules it bundles change.
on:
  push:
    branches: [master]
    paths:
      - tools/extract_sprites.py
      - tools/i18n.py
      - tools/extract_strings.py
      - tools/isoext.py
      - tools/area000.py
      - tools/wpp.py
      - tools/anim.py
      - tools/vram.py
      - tools/screens.py
      - tools/room.py
      - tools/cdfiles.py
      - tools/audio.py
      - tools/str.py
      - tools/icons/**
      - .github/workflows/assets-exe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: bash
        run: |
          python -m pip install pyinstaller pillow numpy lameenc
          pyinstaller --onefile --name tombi-assets --distpath build/exe --workpath build/pyi --specpath . \
            --hidden-import i18n --hidden-import extract_strings --hidden-import area000 --hidden-import wpp --hidden-import anim --hidden-import vram --hidden-import screens --hidden-import room --hidden-import cdfiles --hidden-import audio --hidden-import str --hidden-import numpy --hidden-import lameenc --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.JpegImagePlugin --hidden-import PIL.GifImagePlugin --paths tools \
            --icon tools/icons/assets.ico --add-data "tools/isoext.py;." --add-data "tools/icons/assets.ico;icons" --add-data "tools/icons/assets.png;icons" tools/extract_sprites.py
          mkdir -p dist/windows
          cp build/exe/tombi-assets.exe dist/windows/tombi-assets.exe

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/windows/tombi-assets.exe
          if git diff --cached --quiet; then echo "exe unchanged"; exit 0; fi
          git commit -m "dist: rebuild tombi-assets.exe (${GITHUB_SHA::7})"
          git pull --no-rebase -q -X theirs origin master
          git push origin HEAD:master
