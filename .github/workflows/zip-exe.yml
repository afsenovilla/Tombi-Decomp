name: Windows tools zip

# Packs the Windows tools of the rolling "latest" release (tombi-assets/gfx/text.exe and tombi-port.exe) into
# tombi-tools.7z (solid LZMA2: the PyInstaller exes share their Python runtime, ~40 MB instead of ~104 MB; Windows 11
# opens .7z natively) and uploads it to the "latest" release, so they can be downloaded in one go.
# Runs after any of the exe workflows finishes successfully.
on:
  workflow_run:
    workflows: ["Text editor (Windows exe)", "Graphics editor (Windows exe)", "Assets extractor (Windows exe)", "Native port (Windows exe)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-exe
  cancel-in-progress: false

jobs:
  zip:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Zip
        run: |
          mkdir -p w && cd w
          for a in tombi-assets.exe tombi-gfx.exe tombi-text.exe tombi-port.exe; do
            gh release download latest -R "$R" -p "$a" || echo "no $a in latest yet"
          done
          ls tombi-*.exe >/dev/null 2>&1 || { echo "nothing to pack"; exit 0; }
          7z a -t7z -mx=9 -m0=lzma2 -md=256m -ms=on tombi-tools.7z tombi-*.exe
          for i in 1 2 3 4 5; do gh release upload latest tombi-tools.7z -R "$R" --clobber && exit 0; sleep $((i * 5)); done
          exit 1
