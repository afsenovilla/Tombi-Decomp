name: Windows tools zip

# Packs the Windows tools (and the native port launcher when built) (dist/windows/tombi-*.exe) into dist/windows/tombi-tools.7z (solid LZMA2: the four PyInstaller exes share their Python runtime, ~40 MB
# instead of a 104 MB zip, over GitHub's 100 MB file limit; Windows 11 opens .7z natively), so they can be
# downloaded in one go.  Runs after any of the exe workflows finishes (their bot pushes do not trigger push events).
on:
  workflow_run:
    workflows: ["Text editor (Windows exe)", "Graphics editor (Windows exe)", "Assets extractor (Windows exe)", "Native port (Windows exe)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-exe
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Zip
        run: |
          rm -f dist/windows/tombi-tools.zip dist/windows/tombi-tools.7z
          cd dist/windows && 7z a -t7z -mx=9 -m0=lzma2 -md=256m -ms=on tombi-tools.7z tombi-assets.exe tombi-gfx.exe tombi-text.exe $(ls tombi-port.exe 2>/dev/null)

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch dist/windows/tombi-tools.zip
          git add -f dist/windows/tombi-tools.7z
          if git diff --cached --quiet; then echo "archive unchanged"; exit 0; fi
          git commit -m "dist: rebuild tombi-tools.7z"
          git pull --no-rebase -q -X theirs origin master
          git push origin HEAD:master
