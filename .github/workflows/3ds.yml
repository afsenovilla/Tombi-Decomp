name: Native port (Nintendo 3DS)

# Builds the native-pointer port (port2/) as a Nintendo 3DS homebrew program, tombi.3dsx (docs/PORT.md "Nintendo 3DS"):
# port2/CMakeLists.txt with devkitPro's 3DS.cmake toolchain, inside devkitPro's own devkitARM container image (devkitARM,
# libctru, citro3d; SDL2's 3DS port from its portlibs).  As in android-apk.yml the generator takes the retail
# addresses and the MAIN0/X000 image from the owner's own disc (GAME_FILES_URL secret); the .3dsx carries NO game data
# files (the player copies their own disc image to sdmc:/3ds/tombi/).
on:
  push:
    branches: [master, "claude/**"]
    paths:
      - port2/**
      - port/tools/gen_port.py
      - port/fixes.txt
      - .github/workflows/3ds.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n3ds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n3ds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain (matching build)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu libyaml-dev
          python3 -m pip install -r tools/requirements.txt
          python3 -m pip install --no-deps splat64==0.35.2
          python3 -c "import site,os; open(os.path.join(site.getsitepackages()[0],'pylibyaml.py'),'w').write('# optional accelerator stub\n')"
          sudo tools/setup_native.sh

      - name: Restore disc image
        id: disccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/disccache
          key: disc-pal-v1

      - name: Fetch game files
        id: fetch
        env:
          GAME_FILES_URL: ${{ secrets.GAME_FILES_URL2 || secrets.GAME_FILES_URL }}
        run: |
          if [ -z "$GAME_FILES_URL" ]; then
            echo "::notice::GAME_FILES_URL secret not set; skipping the 3DS build."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          URL="$(printf '%s' "$GAME_FILES_URL" | tr -d '\r\n"'"'"' ')"
          URL="$(printf '%s' "$URL" | sed -E 's#(dropbox\.com/.*[?&])dl=0#\1dl=1#')"
          mkdir -p "$RUNNER_TEMP/disccache"
          if [ -s "$RUNNER_TEMP/disccache/game.bin" ]; then cp "$RUNNER_TEMP/disccache/game.bin" "$RUNNER_TEMP/game.dl"
          else bash tools/ci_download.sh "$URL" "$RUNNER_TEMP/game.dl" 100000000; fi
          if [ "$(stat -c%s "$RUNNER_TEMP/game.dl")" -lt 100000000 ]; then
            echo "::error::The port build needs the whole disc image."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/game"
          python3 -I tools/isoext.py "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/game"
          mkdir -p game/disc/fs
          cp -r "$RUNNER_TEMP/game"/. game/disc/fs/
          cp "$(find "$RUNNER_TEMP/game" -iname MAIN0.EXE | head -1)" game/MAIN0.EXE
          for a in 00 01 02 03 04 05 06 08 09 10 11 13 14 16 17 18 19; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*AREA$a/X0$a.BIN" | head -1)"
            mkdir -p "game/AREA$a"; cp "$f" "game/AREA$a/X0$a.BIN"
          done
          mkdir -p game/disc/fs/SYSTEM
          for s in O0PTSUB0 D0SPSUB D0SPSUB2 D0SPSUB3 G0OVER I0NFO I0NFO2 I0NFO3; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*SYSTEM/$s.BIN" | head -1)"; cp "$f" "game/disc/fs/SYSTEM/$s.BIN"
          done
          [ -s "$RUNNER_TEMP/disccache/game.bin" ] || mv "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/disccache/game.bin"
          rm -f "$RUNNER_TEMP/game.dl"
          echo "bec8dc5f4116f5e497f2337eef8c523ff6dee8fc  game/MAIN0.EXE" | sha1sum -c -
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Save disc image
        if: steps.fetch.outputs.ok == 'true' && steps.disccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/disccache
          key: disc-pal-v1

      # build/full: the same exact-key cache as port2-exe.yml / android-apk.yml
      - name: Cache key
        id: key
        run: echo "full=v1-${{ hashFiles('src/**', 'include/**', 'asm/**', 'config/**', 'tools/build_full.py', 'tools/ncheck.py', 'tools/sysovl.py', 'tools/requirements.txt', 'tools/setup_native.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore matching build
        id: full
        if: steps.fetch.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/full
            build/*.EXE
            build/*.BIN
            !build/full/tmp
          key: full-${{ steps.key.outputs.full }}

      - name: Matching build (retail addresses for the generator)
        if: steps.fetch.outputs.ok == 'true' && steps.full.outputs.cache-hit != 'true'
        run: python3 tools/build_full.py -j "$(nproc)"

      - name: Touch restored matching build
        if: steps.full.outputs.cache-hit == 'true'
        run: find build/full -type f -exec touch {} +; touch build/*.EXE build/*.BIN 2>/dev/null || true

      - name: Save matching build
        if: steps.fetch.outputs.ok == 'true' && steps.full.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/full
            build/*.EXE
            build/*.BIN
            !build/full/tmp
          key: full-${{ steps.key.outputs.full }}

      - name: Build tombi.3dsx (devkitARM container)
        if: steps.fetch.outputs.ok == 'true'
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e SDL2_VERSION=2.30.11 devkitpro/devkitarm:latest bash -ec '
            dkp-pacman -Q | grep -E "libctru|citro3d|devkitARM" || true
            apt-get update -qq && apt-get install -y -qq python3 cmake ninja-build binutils-mipsel-linux-gnu curl >/dev/null
            git config --global --add safe.directory /w || true
            # SDL2 with its Nintendo 3DS backend (docs/README-n3ds.md), from the pinned release tarball (devkitPro
            # packages only SDL 1.2 for the 3DS); installed into the portlibs folder, where CMakeLists.txt looks
            mkdir -p /tmp/sdl && cd /tmp/sdl
            curl -fsSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
            tar xzf sdl.tar.gz
            cmake -S SDL2-${SDL2_VERSION} -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake -DCMAKE_BUILD_TYPE=Release \
                  -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX=$DEVKITPRO/portlibs/3ds > /dev/null
            cmake --build build -j "$(nproc)" > /dev/null && cmake --install build > /dev/null
            ls $DEVKITPRO/portlibs/3ds/lib | grep -i sdl
            cd /w
            cmake -S port2 -B build/n3ds -G Ninja -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake -DCMAKE_BUILD_TYPE=Release
            cmake --build build/n3ds -j "$(nproc)" -- -k 0 > build/n3ds/build.log 2>&1 || true
            grep -E "error|Error|FAILED|undefined reference|multiple definition" build/n3ds/build.log | head -200 || true
            tail -5 build/n3ds/build.log
            echo "== stubs"; sed -n "/## psyq\/bios stubs/,/## port-runtime/p" build/n3ds/gen/report.txt | awk "{print \$1}" | tr "\n" " "; echo
            ls -l build/n3ds/*.3dsx
            python3 port2/n3ds/check_3dsx.py build/n3ds/tombi.3dsx build/n3ds/tombi.elf $DEVKITARM/bin/arm-none-eabi-nm
          '
          sudo chown -R "$(id -u):$(id -g)" build

      # tombi.cia: the same ELF installed as a HOME Menu title (makerom, port2/n3ds/tombi.rsf).  makerom and bannertool
      # are not in devkitPro's packages: their latest releases.  The banner is generated (a title on a gradient, a
      # second of silence): no game art is shipped.
      - name: Build tombi.cia
        if: steps.fetch.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core > /dev/null
          mkdir -p "$RUNNER_TEMP/ctr" && cd "$RUNNER_TEMP/ctr"
          asset() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" \
                    | python3 -c "import sys,json,re; a=[x['browser_download_url'] for x in json.load(sys.stdin)['assets'] if re.search(sys.argv[1], x['name'], re.I)]; print(a[0] if a else '')" "$2"; }
          u=$(asset 3DSGuy/Project_CTR 'makerom.*ubuntu.*\.zip$'); echo "makerom: $u"; curl -fsSL -o makerom.zip "$u"; unzip -oq makerom.zip -d makerom
          u=$(asset Epicpkmn11/bannertool 'bannertool.*\.zip$'); echo "bannertool: $u"; curl -fsSL -o bannertool.zip "$u"; unzip -oq bannertool.zip -d bannertool
          MAKEROM=$(find makerom -type f -name makerom | head -1); BANNERTOOL=$(find bannertool -type f -path "*linux-x86_64*" -name bannertool | head -1)
          chmod +x "$MAKEROM" "$BANNERTOOL"
          # the banner (what the HOME Menu shows above the icon): the game's own title logo, read from the disc of this
          # build (tools/n3ds_banner_logo.py; the owner's exception to "no game graphics": only in the built title)
          python3 "$GITHUB_WORKSPACE/tools/n3ds_banner_logo.py" "$GITHUB_WORKSPACE/game/disc/fs" logo.png
          convert -size 256x128 xc:none \( logo.png -resize 256x128 \) -gravity center -composite PNG32:banner.png   # (as large as it fits, nothing behind it)
          python3 -c "import wave; w=wave.open('silence.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(32000); w.writeframes(bytes(4*32000)); w.close()"
          "$BANNERTOOL" makebanner -i banner.png -a silence.wav -o banner.bnr
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/ctr/$MAKEROM" -f cia -o build/n3ds/tombi.cia -elf build/n3ds/tombi.elf -rsf port2/n3ds/tombi.rsf \
                  -icon build/n3ds/tombi.smdh -banner "$RUNNER_TEMP/ctr/banner.bnr" -exefslogo -target t
          # tombi.cci: the same title as a cartridge image, for emulators that load .cci/.3ds and not .cia
          "$RUNNER_TEMP/ctr/$MAKEROM" -f cci -o build/n3ds/tombi.cci -elf build/n3ds/tombi.elf -rsf port2/n3ds/tombi.rsf \
                  -icon build/n3ds/tombi.smdh -banner "$RUNNER_TEMP/ctr/banner.bnr" -exefslogo -target t
          ls -l build/n3ds/tombi.cia build/n3ds/tombi.cci

      - name: Upload tombi.3dsx
        if: steps.fetch.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tombi-3ds
          path: |
            build/n3ds/*.3dsx
            build/n3ds/*.cia
            build/n3ds/*.cci
            build/n3ds/tombi.elf
          if-no-files-found: warn

      - name: Upload build log
        if: always() && steps.fetch.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tombi-3ds-build-log
          path: build/n3ds/build.log
          if-no-files-found: ignore

  # The .3dsx run in Azahar (a 3DS emulator; its Linux AppImage, the latest release) under Xvfb with Mesa's software
  # OpenGL: screenshots of the emulator's window every 15 s and the program's sdmc:/3ds/tombi/log.txt, as an artifact.
  # The emulator's speed and timing are not the console's: this checks that it starts and draws, not how fast.
  emulate:
    needs: n3ds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tombi-3ds
          path: app

      - name: Restore disc image
        id: disccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/disccache
          key: disc-pal-v1

      - name: Azahar (latest release AppImage)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils imagemagick libgl1-mesa-dri libegl1 libopengl0 libgl1 libglx-mesa0 libvulkan1 mesa-vulkan-drivers binutils-arm-none-eabi libxkbcommon-x11-0 libxcb-cursor0 \
               libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libfuse2 > /dev/null
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/azahar-emu/azahar/releases/latest \
                | python3 -c "import sys,json; a=[x['browser_download_url'] for x in json.load(sys.stdin)['assets'] if x['name'].lower().endswith('.appimage')]; print(a[0] if a else '')")
          echo "AppImage: $url"
          curl -fsSL -o azahar.AppImage "$url"
          chmod +x azahar.AppImage
          ./azahar.AppImage --appimage-extract > /dev/null
          ls squashfs-root | head

      - name: Run in Azahar
        env:
          ADDRS: "0x003A5DC8 0x0039C9AC 0x00398AD0 0x002D6358"   # (a crash dialog's pc / lr, to name)
        run: |
          SD="$HOME/.local/share/azahar-emu/sdmc"
          mkdir -p "$SD/3ds/tombi" shots
          cp "$RUNNER_TEMP/disccache/game.bin" "$SD/3ds/tombi/tombi.bin"
          # frame and VRAM dumps (runtime/main.c --dump-frames / --dump-vram) of what the 3DS renderer holds
          # gameplay measured too: the debug area select into AREA 1, then walking right (as in CLAUDE.md's cheatsheet)
          echo "--log-fps --skip-movies --poke 900:1F8001B4:1 --poke 1250:8009C960:0:2 --poke 1250:8009C962:0:2 --pad-script 1000:start,1300:circle:3,2000:right:3000" > "$SD/3ds/tombi/args.txt"
          mkdir -p "$SD/3ds/tombi/dump"
          ls -l app "$SD/3ds/tombi"
          export LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb
          Xvfb :99 -screen 0 1280x1024x24 & sleep 2
          export DISPLAY=:99
          ./squashfs-root/AppRun "$PWD/app/tombi.3dsx" > azahar.log 2>&1 &
          EMU=$!
          for i in $(seq 1 16); do sleep 15; import -window root "shots/shot_$(printf %03d $((i*15))).png" || true; done
          kill "$EMU" 2>/dev/null || true; sleep 2
          cp "$SD/3ds/tombi/log.txt" shots/log.txt 2>/dev/null || echo "(no log.txt)" > shots/log.txt
          ls "$SD/3ds/tombi/dump" | head -40
          for f in frame_000800 vram_000800 frame_001400 vram_001400; do
            [ -f "$SD/3ds/tombi/dump/$f.png" ] || continue
            convert "$SD/3ds/tombi/dump/$f.png" -quality 80 "dump_$f.jpg"
            echo "=====BEGIN $f====="; base64 -w 100 "dump_$f.jpg"; echo "=====END $f====="
          done
          echo "== windows"; xwininfo -root -tree | grep -v "has no name" | head -30 || true
          echo "== azahar.log"; grep -v -i "keysym\|xkbcomp" azahar.log | head -120
          echo "== azahar_log.txt"; find "$HOME/.local/share/azahar-emu" -name "*.txt" -path "*log*" -exec grep -v "Config <Info>" {} \; 2>/dev/null | grep -i -E "loader|3dsx|error|critical|warning|tombi|svc|memory" | head -80
          echo "== code addresses in the emulator's log"
          L=$(find "$HOME/.local/share/azahar-emu" -name "*.txt" -path "*log*" | head -1)
          grep -o "at PC 0x[0-9A-Fa-f]*" "$L" | awk '{print $3}' | sort | uniq -c | sort -rn | head -12 | while read n a; do
            echo "$n x $a $(arm-none-eabi-addr2line -f -s -e app/tombi.elf $a | tr '\n' ' ')"; done
          for a in $ADDRS; do echo "$a $(arm-none-eabi-addr2line -f -s -e app/tombi.elf $a | tr '\n' ' ')"; done
          echo "== log.txt (start)"; head -30 shots/log.txt
          echo "== log.txt (end)"; tail -20 shots/log.txt
          echo "== fps"; grep "\[port\] fps" shots/log.txt | sed -n "5~10p" | head -12

      # the cartridge image and the installable title are the same ELF in another container (makerom): started too,
      # since a .cci is what some emulator front ends (Android) load
      - name: Run tombi.cci in Azahar
        if: always()
        run: |
          SD="$HOME/.local/share/azahar-emu/sdmc"
          rm -f "$SD/3ds/tombi/log.txt"; echo "--log-fps -v" > "$SD/3ds/tombi/args.txt"   # (the defaults: the logo movie plays)
          L=$(find "$HOME/.local/share/azahar-emu" -name "*.txt" -path "*log*" | head -1); [ -n "$L" ] && : > "$L"
          export LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb
          Xvfb :98 -screen 0 1280x1024x24 & sleep 2
          export DISPLAY=:98
          # first without a disc image: the chooser (n3ds/main_3ds.c) must be on the top screen
          mv "$SD/3ds/tombi/tombi.bin" "$SD/tombi_away.bin"; rm -f "$SD/3ds/tombi/disc.txt"
          ./squashfs-root/AppRun "$PWD/app/tombi.cci" > azahar_nodisc.log 2>&1 &
          EMU=$!
          sleep 30; import -window root shots/nodisc_030.png || true
          kill "$EMU" 2>/dev/null || true; sleep 2
          convert shots/nodisc_030.png -trim +repage -quality 75 small_nodisc.jpg && { echo "=====BEGIN shot_nodisc====="; base64 -w 100 small_nodisc.jpg; echo "=====END shot_nodisc====="; }
          mv "$SD/tombi_away.bin" "$SD/3ds/tombi/tombi.bin"
          ./squashfs-root/AppRun "$PWD/app/tombi.cci" > azahar_cci.log 2>&1 &
          EMU=$!
          sleep 60; import -window root shots/cci_060.png || true
          kill "$EMU" 2>/dev/null || true; sleep 2
          echo "== azahar_cci.log"; grep -v -i "keysym\|xkbcomp" azahar_cci.log | head -60
          L=$(find "$HOME/.local/share/azahar-emu" -name "*.txt" -path "*log*" | head -1)
          echo "== emulator log"; grep -v "Config <Info>" "$L" | grep -i -E "loader|ncch|error|critical|warning|svc|memory|unmapped|exception" | head -60
          echo "== code addresses"; grep -o "at PC 0x[0-9A-Fa-f]*" "$L" | awk '{print $3}' | sort | uniq -c | sort -rn | head -8 | while read n a; do
            echo "$n x $a $(arm-none-eabi-addr2line -f -s -e app/tombi.elf $a | tr '\n' ' ')"; done
          echo "== log.txt of the .cci run"; head -30 "$SD/3ds/tombi/log.txt" 2>/dev/null || echo "(no log.txt: the program did not get to its main)"
          grep "\[port\] fps" "$SD/3ds/tombi/log.txt" 2>/dev/null | tail -3
          grep "st: stream" "$SD/3ds/tombi/log.txt" 2>/dev/null | head -4
          convert shots/cci_060.png -trim +repage -quality 75 small_cci.jpg && { echo "=====BEGIN shot_cci====="; base64 -w 100 small_cci.jpg; echo "=====END shot_cci====="; }

      # (small JPEGs of three screenshots in the job log, base64 between markers: readable without the artifact API)
      - name: Screenshots in the log
        if: always()
        run: |
          for t in 060 120 240; do
            f="shots/shot_$t.png"; [ -f "$f" ] || continue
            convert "$f" -trim +repage -quality 75 "small_$t.jpg"   # (the emulator window, full size)
            echo "=====BEGIN shot_$t====="; base64 -w 100 "small_$t.jpg"; echo "=====END shot_$t====="
          done

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tombi-3ds-azahar
          path: |
            shots
            azahar.log
          if-no-files-found: ignore
