        with:
          name: PCPX_960.84_report
          path: build/pcpx96084/report.json

  # "Tomba! (Beta prototype) (1998-02-03)", CD-R "TOMBI NTSC Preview Version": the English preview build between the
  # JP retail and the USA release (boot SLPS_011.44, a different executable from JP retail). Separate decomp.dev
