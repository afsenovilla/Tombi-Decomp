          chmod +x "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Build PrePre 8 report
        if: steps.fetch.outputs.ok == 'true'
        run: python3 tools/build_report.py --version pcpx96084 --objdiff "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Upload PrePre 8 report
        if: steps.fetch.outputs.ok == 'true'
