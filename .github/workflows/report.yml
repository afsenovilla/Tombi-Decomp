name: Progress report

on:
  # At most one decomp.dev update a day, Monday to Friday (saves Actions minutes); run by hand from the Actions tab if needed.
  schedule:
    - cron: '47 2 * * 1-5'
  workflow_dispatch:

concurrency:
  group: report
  cancel-in-progress: true

jobs:
  # Skip the daily run when no code changed in the last day.
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: |
          n=$(git log --since='25 hours ago' --oneline -- src config include tools notes | wc -l)
          if [ "$n" -gt 0 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then c=true; else c=false; fi
          echo "changed=$c" >> "$GITHUB_OUTPUT"

  report:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu libyaml-dev
          python3 -m pip install -r tools/requirements.txt
          python3 -m pip install --no-deps splat64==0.35.2
          python3 -c "import site,os; open(os.path.join(site.getsitepackages()[0],'pylibyaml.py'),'w').write('# optional accelerator stub\n')"
          sudo tools/setup_native.sh
          mkdir -p "$RUNNER_TEMP/objdiff"
          curl -fsSL -o "$RUNNER_TEMP/objdiff/objdiff-cli" https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          chmod +x "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Fetch game files
        id: fetch
        env:
          GAME_FILES_URL: ${{ secrets.GAME_FILES_URL }}
        run: |
          # GAME_FILES_URL: direct download link to EITHER a zip with MAIN0.EXE and AREA00/X000.BIN (legacy; only the
          # MAIN0/X000 report is produced) OR a raw disc image (.bin, 2352-byte sectors) of your own copy of the game,
          # from which every area overlay is extracted. Never committed to the repository.
          if [ -z "$GAME_FILES_URL" ]; then
            echo "::notice::GAME_FILES_URL secret not set; skipping the report."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Accepts a direct URL, a Google Drive share link (.../file/d/<ID>/view) or a bare Drive file ID.
          URL="$(printf '%s' "$GAME_FILES_URL" | tr -d '\r\n"'"'"' ')"
          ID="$(printf '%s' "$URL" | sed -nE 's#.*drive\.google\.com/(file/d/|open\?id=|uc\?.*id=)([A-Za-z0-9_-]+).*#\2#p')"
          if [ -z "$ID" ] && ! printf '%s' "$URL" | grep -q '://'; then ID="$URL"; fi
          if [ -n "$ID" ]; then URL="https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"; fi
          curl -fsSL -o "$RUNNER_TEMP/game.dl" "$URL"
          mkdir -p "$RUNNER_TEMP/game"
          if unzip -tq "$RUNNER_TEMP/game.dl" >/dev/null 2>&1; then
            unzip -o -q "$RUNNER_TEMP/game.dl" -d "$RUNNER_TEMP/game"
          elif [ "$(stat -c%s "$RUNNER_TEMP/game.dl")" -gt 100000000 ]; then
            python3 -I tools/isoext.py "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/game"
          else
            echo "::error::The download is neither a zip nor a disc image. Share the file as 'Anyone with the link' and check GAME_FILES_URL."; exit 1
          fi
          mkdir -p game/AREA00
          cp "$(find "$RUNNER_TEMP/game" -iname MAIN0.EXE | head -1)" game/MAIN0.EXE
          cp "$(find "$RUNNER_TEMP/game" -iname X000.BIN | head -1)" game/AREA00/X000.BIN
          echo "bec8dc5f4116f5e497f2337eef8c523ff6dee8fc  game/MAIN0.EXE" | sha1sum -c -
          echo "ce168475f667f2ca8842eabad2aec829e301c5c5  game/AREA00/X000.BIN" | sha1sum -c -
          for a in 01 02 03 04 05 06 08 09 10 11 13 14 16 17 18 19; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*AREA$a/X0$a.BIN" | head -1)"
            if [ -n "$f" ]; then mkdir -p "game/AREA$a"; cp "$f" "game/AREA$a/X0$a.BIN"; fi
          done
          ls game/AREA*/X0*.BIN | wc -l
          # SYSTEM code overlays (tools/sysovl.py reads them from game/disc/fs/SYSTEM)
          mkdir -p game/disc/fs/SYSTEM
          for s in O0PTSUB0 D0SPSUB D0SPSUB2 D0SPSUB3 G0OVER I0NFO I0NFO2 I0NFO3; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*SYSTEM/$s.BIN" | head -1)"
            if [ -n "$f" ]; then cp "$f" "game/disc/fs/SYSTEM/$s.BIN"; else echo "::error::SYSTEM/$s.BIN missing"; exit 1; fi
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Build report
        if: steps.fetch.outputs.ok == 'true'
        run: python3 tools/build_report.py --objdiff "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Upload report
        if: steps.fetch.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SCES_013.31_report
          path: build/report.json

  # Japanese release (Ore! Tomba, SLPS-01144). Same repo, separate decomp.dev version: artifact SLPS_011.44_report.
  # The disc image comes from the GAME_FILES_URL_JP secret (raw .bin disc image, 2352-byte sectors, or a zip with the
  # extracted disc; never committed). Skipped when the secret or config/slps01144/ is missing. See docs/JP.md.
  report-jp:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Japanese disc
        id: fetch
        env:
          GAME_FILES_URL_JP: ${{ secrets.GAME_FILES_URL_JP }}
        run: |
          if [ -z "$GAME_FILES_URL_JP" ]; then
            echo "::notice::GAME_FILES_URL_JP secret not set; skipping the Japanese report."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f config/slps01144/slps01144.yaml ]; then
            echo "::notice::config/slps01144 not set up; Japanese report skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          URL="$(printf '%s' "$GAME_FILES_URL_JP" | tr -d '\r\n"'"'"' ')"
          ID="$(printf '%s' "$URL" | sed -nE 's#.*drive\.google\.com/(file/d/|open\?id=|uc\?.*id=)([A-Za-z0-9_-]+).*#\2#p')"
          if [ -z "$ID" ] && ! printf '%s' "$URL" | grep -q '://'; then ID="$URL"; fi
          if [ -n "$ID" ]; then URL="https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"; fi
          curl -fsSL -o "$RUNNER_TEMP/jp.dl" "$URL"
          mkdir -p "$RUNNER_TEMP/jp"
          if unzip -tq "$RUNNER_TEMP/jp.dl" >/dev/null 2>&1; then
            unzip -o -q "$RUNNER_TEMP/jp.dl" -d "$RUNNER_TEMP/jp"
          elif [ "$(stat -c%s "$RUNNER_TEMP/jp.dl")" -gt 100000000 ]; then
            python3 -I tools/isoext.py "$RUNNER_TEMP/jp.dl" "$RUNNER_TEMP/jp"
          else
            echo "::error::The download is neither a zip nor a disc image. Share the file as 'Anyone with the link' and check GAME_FILES_URL_JP."; exit 1
          fi
          mkdir -p game_jp/SYSTEM
          cp "$(find "$RUNNER_TEMP/jp" -iname SLPS_011.44 | head -1)" game_jp/SLPS_011.44
          echo "07d577698ad31ec1a69b9d7b80a7c3f90b650888  game_jp/SLPS_011.44" | sha1sum -c -
          for f in X00 X01 X02 X03 X04 X05 X06 X08 X09 X10 X11 X13 X14 X16 X17 X18 X19; do
            cp "$(find "$RUNNER_TEMP/jp" -ipath "*SYSTEM/$f.BIN" | head -1)" "game_jp/SYSTEM/$f.BIN"
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        if: steps.fetch.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu libyaml-dev
          python3 -m pip install -r tools/requirements.txt
          python3 -m pip install --no-deps splat64==0.35.2
          python3 -c "import site,os; open(os.path.join(site.getsitepackages()[0],'pylibyaml.py'),'w').write('# optional accelerator stub\n')"
          sudo tools/setup_native.sh
          mkdir -p "$RUNNER_TEMP/objdiff"
          curl -fsSL -o "$RUNNER_TEMP/objdiff/objdiff-cli" https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          chmod +x "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Build Japanese report
        if: steps.fetch.outputs.ok == 'true'
        run: python3 tools/build_report.py --version slps01144 --objdiff "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Upload Japanese report
        if: steps.fetch.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SLPS_011.44_report
          path: build/slps01144/report.json

  # Japanese demo disc (SLPM-80165, "Ore! Tomba" taikenban). Separate decomp.dev version named after its boot
  # executable: artifact SLPM_801.65_report. The image comes from the GAME_FILES_URL_JP_DEMO secret (raw .bin disc
  # image or a zip with SLPM_801.65 and SYSTEM/X00.BIN; never committed). Skipped when the secret or config/slpm80165/ is
  # missing. See docs/JPDEMO.md.
  report-jpdemo:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch demo disc
        id: fetch
        env:
          GAME_FILES_URL_JP_DEMO: ${{ secrets.GAME_FILES_URL_JP_DEMO }}
        run: |
          if [ -z "$GAME_FILES_URL_JP_DEMO" ]; then
            echo "::notice::GAME_FILES_URL_JP_DEMO secret not set; skipping the demo report."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f config/slpm80165/slpm80165.yaml ]; then
            echo "::notice::config/slpm80165 not set up; demo report skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          URL="$(printf '%s' "$GAME_FILES_URL_JP_DEMO" | tr -d '\r\n"'"'"' ')"
          ID="$(printf '%s' "$URL" | sed -nE 's#.*drive\.google\.com/(file/d/|open\?id=|uc\?.*id=)([A-Za-z0-9_-]+).*#\2#p')"
          if [ -z "$ID" ] && ! printf '%s' "$URL" | grep -q '://'; then ID="$URL"; fi
          if [ -n "$ID" ]; then URL="https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"; fi
          curl -fsSL -o "$RUNNER_TEMP/jpdemo.dl" "$URL"
          mkdir -p "$RUNNER_TEMP/jpdemo"
          if unzip -tq "$RUNNER_TEMP/jpdemo.dl" >/dev/null 2>&1; then
            unzip -o -q "$RUNNER_TEMP/jpdemo.dl" -d "$RUNNER_TEMP/jpdemo"
          elif [ "$(stat -c%s "$RUNNER_TEMP/jpdemo.dl")" -gt 10000000 ]; then
            python3 -I tools/isoext.py "$RUNNER_TEMP/jpdemo.dl" "$RUNNER_TEMP/jpdemo"
          else
            echo "::error::The download is neither a zip nor a disc image. Share the file as 'Anyone with the link' and check GAME_FILES_URL_JP_DEMO."; exit 1
          fi
          mkdir -p game_jpdemo/SYSTEM
          cp "$(find "$RUNNER_TEMP/jpdemo" -iname SLPM_801.65 | head -1)" game_jpdemo/SLPM_801.65
          cp "$(find "$RUNNER_TEMP/jpdemo" -ipath '*SYSTEM/X00.BIN' | head -1)" game_jpdemo/SYSTEM/X00.BIN
          echo "44360f12e7bd9449a7d46deb412d6a9499b6c94c  game_jpdemo/SLPM_801.65" | sha1sum -c -
          echo "fb7cbf02470e8bcbf700414dd7fada0d19578852  game_jpdemo/SYSTEM/X00.BIN" | sha1sum -c -
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        if: steps.fetch.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu libyaml-dev
          python3 -m pip install -r tools/requirements.txt
          python3 -m pip install --no-deps splat64==0.35.2
          python3 -c "import site,os; open(os.path.join(site.getsitepackages()[0],'pylibyaml.py'),'w').write('# optional accelerator stub\n')"
          sudo tools/setup_native.sh
          mkdir -p "$RUNNER_TEMP/objdiff"
          curl -fsSL -o "$RUNNER_TEMP/objdiff/objdiff-cli" https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          chmod +x "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Build demo report
        if: steps.fetch.outputs.ok == 'true'
        run: python3 tools/build_report.py --version slpm80165 --objdiff "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Upload demo report
        if: steps.fetch.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SLPM_801.65_report
          path: build/slpm80165/report.json
