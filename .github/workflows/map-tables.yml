# The pause map's graph (nodes, links, routes, orphan nodes) of every demo / prototype / retail disc held in a
# GAME_FILES_URL_* secret, against the PAL retail one (tools/map_tables.py). Discs come from secrets, never
# committed; the job summary gets table sizes, coordinates and diffs only.
name: map-tables

on:
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        disc: [PREPRE8, PREPRE9, DENGEKI_D5, JP_DEMO, BETA980203, JP, USA]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the disc and the PAL reference
        env:
          URL_PAL: ${{ secrets.GAME_FILES_URL }}
          URL_PREPRE8: ${{ secrets.GAME_FILES_URL_PREPRE8 }}
          URL_PREPRE9: ${{ secrets.GAME_FILES_URL_PREPRE9 }}
          URL_DENGEKI_D5: ${{ secrets.GAME_FILES_URL_DENGEKI_D5 }}
          URL_JP_DEMO: ${{ secrets.GAME_FILES_URL_JP_DEMO }}
          URL_BETA980203: ${{ secrets.GAME_FILES_URL_BETA980203 }}
          URL_JP: ${{ secrets.GAME_FILES_URL_JP }}
          URL_USA: ${{ secrets.GAME_FILES_URL_USA }}
          DISC: ${{ matrix.disc }}
        run: |
          fetch() {  # $1 secret value, $2 out dir: the disc's files extracted (zip / 7z / image)
            [ -n "$1" ] || { echo "::warning::secret for $2 not set"; return 1; }
            URL="$(printf '%s' "$1" | tr -d '\r\n"'"'"' ')"
            mkdir -p "$RUNNER_TEMP/$2.d"; cd "$RUNNER_TEMP/$2.d"
            bash "$GITHUB_WORKSPACE/tools/ci_download.sh" "$URL" dl 10000000
            if unzip -tq dl >/dev/null 2>&1; then unzip -o -q dl -d x
            elif 7z t dl >/dev/null 2>&1; then 7z x -y -ox dl >/dev/null
            else mkdir -p x; mv dl x/disc.bin; fi
            chmod -R u+rwX x   # some archives carry read-only folders
            rm -f dl
            IMG="$(find x -type f \( -iname '*.bin' -o -iname '*.iso' -o -iname '*.img' \) -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2-)"
            mkdir -p "$RUNNER_TEMP/$2"
            if [ -n "$IMG" ]; then python3 -I "$GITHUB_WORKSPACE/tools/isoext.py" "$IMG" "$RUNNER_TEMP/$2"
            else cp -r x/. "$RUNNER_TEMP/$2"; fi
            cd "$GITHUB_WORKSPACE"; rm -rf "$RUNNER_TEMP/$2.d"
          }
          V="URL_$DISC"; fetch "${!V}" disc || { echo "::error::GAME_FILES_URL_$DISC is not set."; exit 1; }
          fetch "$URL_PAL" pal || true
          echo "sub-screen overlays and executables on the disc:"
          find "$RUNNER_TEMP/disc" -type f \( -iname '*SPSUB*' -o -iname 'DSP*' -o -iname '*.EXE' -o -iname 'S[LC]*_*.*' \) -printf '%s %p\n' | sort -k2 | head -60

      - name: Map tables
        run: |
          REF="$(find "$RUNNER_TEMP/pal" -ipath '*SYSTEM/D0SPSUB.BIN' | head -1)"
          {
            echo "## GAME_FILES_URL_${{ matrix.disc }} (reference: PAL SCES-01331 D0SPSUB.BIN)"; echo
            python3 -I tools/map_tables.py "$RUNNER_TEMP/disc" ${REF:+--ref "$REF"} --dump
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/disc" "$RUNNER_TEMP/pal"
