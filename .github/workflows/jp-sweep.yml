name: JP sweep

# Automatic matching sweep over the Japanese builds, no hand work: tools/jp_autofix.py (SLPS-01144: PAL C compiled for
# JP with literals shifted, installed when it matches byte for byte) and tools/demo_sweep.py (SLPM-80165, BETA_980203,
# PCPX-96084, SCUS-94236: existing PAL / JP C compiled for the version, installed on a strict match). Discs come from the secrets,
# never committed. When something was installed, the reports and README are rebuilt and a pull request is opened for
# review; nothing is pushed to master by this workflow. Runs on demand and after a push that lands JP C.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['src/**_slps01144.c', 'config/slps01144/**', 'config/slpm80165/**', 'config/beta980203/**', 'config/pcpx96084/**', 'config/scus94236/**']

concurrency:
  group: jp-sweep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/disc-cache   # the discs stay in the Actions cache between runs
        with:
          urls: ${{ secrets.GAME_FILES_URL }}${{ secrets.GAME_FILES_URL_JP }}${{ secrets.GAME_FILES_URL_JP_DEMO }}${{ secrets.GAME_FILES_URL_BETA980203 }}${{ secrets.GAME_FILES_URL_PREPRE8 }}${{ secrets.GAME_FILES_URL_USA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu libyaml-dev
          python3 -m pip install -r tools/requirements.txt
          python3 -m pip install --no-deps splat64==0.35.2
          python3 -c "import site,os; open(os.path.join(site.getsitepackages()[0],'pylibyaml.py'),'w').write('# optional accelerator stub\n')"
          sudo tools/setup_native.sh
          mkdir -p "$RUNNER_TEMP/objdiff"
          curl -fsSL -o "$RUNNER_TEMP/objdiff/objdiff-cli" https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          chmod +x "$RUNNER_TEMP/objdiff/objdiff-cli"

      - name: Fetch discs
        id: fetch
        env:
          GAME_FILES_URL: ${{ secrets.GAME_FILES_URL }}
          GAME_FILES_URL_JP: ${{ secrets.GAME_FILES_URL_JP }}
          GAME_FILES_URL_JP_DEMO: ${{ secrets.GAME_FILES_URL_JP_DEMO }}
          GAME_FILES_URL_BETA980203: ${{ secrets.GAME_FILES_URL_BETA980203 }}
          GAME_FILES_URL_PREPRE8: ${{ secrets.GAME_FILES_URL_PREPRE8 }}
          GAME_FILES_URL_USA: ${{ secrets.GAME_FILES_URL_USA }}
        run: |
          fetch() {  # $1 secret value, $2 out dir under RUNNER_TEMP, $3 "prepre8" for the PrePre 8 extractor; a direct URL, a Drive share link or a bare Drive id; zip or disc image
            [ -n "$1" ] || { echo "::warning::secret for $2 not set"; return 1; }
            URL="$(printf '%s' "$1" | tr -d '\r\n"'"'"' ')"
            tools/ci_download.sh "$URL" "$RUNNER_TEMP/$2.dl" 100000000
            bash tools/disc_unpack.sh "$RUNNER_TEMP/$2.dl" "$RUNNER_TEMP/$2" ${3:-} || return 1
            rm -f "$RUNNER_TEMP/$2.dl"
          }
          # PAL (the masked-word pairing of jp_autofix reads the PAL programs)
          fetch "$GAME_FILES_URL" pal
          mkdir -p game/AREA00 game/disc/fs/SYSTEM
          cp "$(find "$RUNNER_TEMP/pal" -iname MAIN0.EXE | head -1)" game/MAIN0.EXE
          cp "$(find "$RUNNER_TEMP/pal" -iname X000.BIN | head -1)" game/AREA00/X000.BIN
          echo "bec8dc5f4116f5e497f2337eef8c523ff6dee8fc  game/MAIN0.EXE" | sha1sum -c -
          for a in 01 02 03 04 05 06 08 09 10 11 13 14 16 17 18 19; do
            f="$(find "$RUNNER_TEMP/pal" -ipath "*AREA$a/X0$a.BIN" | head -1)"; [ -n "$f" ] && mkdir -p "game/AREA$a" && cp "$f" "game/AREA$a/X0$a.BIN"
          done
          for s in O0PTSUB0 D0SPSUB D0SPSUB2 D0SPSUB3 G0OVER I0NFO I0NFO2 I0NFO3; do
            f="$(find "$RUNNER_TEMP/pal" -ipath "*SYSTEM/$s.BIN" | head -1)"; [ -n "$f" ] && cp "$f" "game/disc/fs/SYSTEM/$s.BIN"
          done
          # JP retail
          if fetch "$GAME_FILES_URL_JP" jp; then
            mkdir -p game_jp/SYSTEM
            cp "$(find "$RUNNER_TEMP/jp" -iname SLPS_011.44 | head -1)" game_jp/SLPS_011.44
            echo "07d577698ad31ec1a69b9d7b80a7c3f90b650888  game_jp/SLPS_011.44" | sha1sum -c -
            for f in X00 X01 X02 X03 X04 X05 X06 X08 X09 X10 X11 X13 X14 X16 X17 X18 X19 DSPSUB DSPSUB2 DSPSUB3 INFO INFO2 INFO3 OPTSUB00; do
              cp "$(find "$RUNNER_TEMP/jp" -ipath "*SYSTEM/$f.BIN" | head -1)" "game_jp/SYSTEM/$f.BIN"
            done
            echo "jp=true" >> "$GITHUB_OUTPUT"
          fi
          # JP demo
          if fetch "$GAME_FILES_URL_JP_DEMO" jpdemo; then
            mkdir -p game_jpdemo/SYSTEM
            cp "$(find "$RUNNER_TEMP/jpdemo" -iname SLPM_801.65 | head -1)" game_jpdemo/SLPM_801.65
            cp "$(find "$RUNNER_TEMP/jpdemo" -ipath '*SYSTEM/X00.BIN' | head -1)" game_jpdemo/SYSTEM/X00.BIN
            echo "44360f12e7bd9449a7d46deb412d6a9499b6c94c  game_jpdemo/SLPM_801.65" | sha1sum -c -
          fi
          # 1998-02-03 beta
          if fetch "$GAME_FILES_URL_BETA980203" beta; then
            mkdir -p game_beta980203/SYSTEM
            cp "$(find "$RUNNER_TEMP/beta" -iname SLPS_011.44 | head -1)" game_beta980203/SLPS_011.44
            cp "$(find "$RUNNER_TEMP/beta" -ipath '*SYSTEM/X00.BIN' | head -1)" game_beta980203/SYSTEM/X00.BIN
            echo "1e69d1414dcca09fe360fe69337fc8e62968fda7  game_beta980203/SLPS_011.44" | sha1sum -c -
          fi
          # PrePre 8
          if fetch "$GAME_FILES_URL_PREPRE8" prepre8 prepre8; then
            mkdir -p game_prepre8
            cp "$(find "$RUNNER_TEMP/prepre8" -iname TOMBA.EXE | head -1)" game_prepre8/TOMBA.EXE
            echo "032d6f371b31085098b86aebbce465d30599293a  game_prepre8/TOMBA.EXE" | sha1sum -c -
          fi
          # USA retail
          if fetch "$GAME_FILES_URL_USA" usa; then
            mkdir -p game_usa/fs/SYSTEM
            cp "$(find "$RUNNER_TEMP/usa" -iname SCUS_942.36 | head -1)" game_usa/fs/SCUS_942.36
            echo "81cbc79f0230aeb4252e058039f47ac95a777f5a  game_usa/fs/SCUS_942.36" | sha1sum -c -
            for f in X00 X01 X02 X03 X04 X05 X06 X08 X09 X10 X11 X13 X14 X16 X17 X18 X19 DSPSUB DSPSUB2 DSPSUB3 INFO INFO2 GOVER INFO3 OPTSUB00; do
              cp "$(find "$RUNNER_TEMP/usa" -ipath "*SYSTEM/$f.BIN" | head -1)" "game_usa/fs/SYSTEM/$f.BIN"
            done
          fi
          rm -rf "$RUNNER_TEMP"/pal "$RUNNER_TEMP"/jp "$RUNNER_TEMP"/jpdemo "$RUNNER_TEMP"/beta "$RUNNER_TEMP"/prepre8 "$RUNNER_TEMP"/usa

      - name: Reports before the sweep
        run: |
          python3 tools/gen_symbols.py >/dev/null
          for v in slps01144 slpm80165 beta980203 pcpx96084 scus94236; do
            d="$(python3 -c "import sys; sys.path.insert(0,'tools'); import versions as V; print(V.VERSIONS['$v']['game'])")"
            [ -d "$d" ] || { echo "$v: no game files, skipped"; continue; }
            python3 tools/build_report.py --version "$v" --objdiff "$RUNNER_TEMP/objdiff/objdiff-cli" | tail -1
          done

      - name: Sweep
        run: |
          set +e
          if [ -s build/slps01144/report.json ]; then
            python3 tools/jp_autofix.py --install 2>&1 | tail -15
          fi
          python3 tools/demo_sweep.py --jobs 4 --fix --budget 20 2>&1 | grep -v "^WARN" | tail -60
          git status --short -- src config | head -40
          echo "changed=$(git status --short -- src config | wc -l)" >> "$GITHUB_ENV"

      - name: Reports after the sweep
        if: env.changed != '0'
        run: |
          for v in slps01144 slpm80165 beta980203 pcpx96084 scus94236; do
            d="$(python3 -c "import sys; sys.path.insert(0,'tools'); import versions as V; print(V.VERSIONS['$v']['game'])")"
            [ -d "$d" ] || continue
            python3 tools/build_report.py --version "$v" --objdiff "$RUNNER_TEMP/objdiff/objdiff-cli" | tail -1
            python3 tools/progress_jp.py --version "$v" | tail -1 || true
          done
          python3 tools/progress_jp.py | tail -1 || true
          date -u > notes/report_stamp.txt
          git status --short -- src config README.md docs notes | tee "$GITHUB_STEP_SUMMARY"

      - name: Commit to master
        if: env.changed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src config README.md notes/report_stamp.txt
          git commit -m "JP sweep: automatic matches (tools/jp_autofix.py, tools/demo_sweep.py)" \
            -m "Every installed function matched byte for byte against its disc. Reports and README regenerated; the docs/JP.md and docs/JPDEMO.md progress lines are not touched by the sweep."
          for d in 2 4 8 16; do git pull --no-rebase -q origin master && git push origin HEAD:master && break || sleep $d; done
