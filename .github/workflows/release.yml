name: Publish release

# Publishes the newest green build of the native port (artifacts bin-<platform>-port of port2-exe, tombi-port-android of
# android-apk) as ONE GitHub Release with tombi-port-<ver>-windows-x64.exe, tombi-port-<ver>-linux-x64.tar.gz (tar keeps
# the executable bit) and tombi-port-<ver>-android.apk (arm64-v8a + armeabi-v7a); the PC launchers bundle the PAL game
# (tombi-pc) and, when port2-exe had the GAME_FILES_URL_USA disc, the USA one (tombi-pc-usa; versions.txt says which);
# with the dispatch input "include tools" also Tombi-Tools-<ver>-windows-x64.zip / -linux-x64.tar.gz (tombi-text,
# tombi-gfx, tombi-assets of assets-exe/gfx-exe/text-exe).  Versions: tag v0.0.N, title "Tombi port 0.0.N",
# <ver> = 0.0.N; N = highest v0.0.* + 1 (auto releases bump the patch of the latest vX.Y.Z); the dispatch input
# "version" (X.Y.Z, greater than the latest) overrides it, e.g. 0.1.0.  Old build-YYYYMMDD-<sha7> releases are dev
# pre-releases (dispatch input migrate_dev=true retitles them "dev build YYYYMMDD-<sha7>", publishes nothing).  The build workflows only
# upload artifacts; a release is made
#   - only on request: Actions > "Publish release" > Run workflow (or `gh workflow run release.yml`).  The automatic
#     release after each green port build was removed: releases are published by hand once the owner approves.
on:
  workflow_dispatch:
    inputs:
      include_tools:
        description: "include tools (Tombi-Tools zip/tar.gz with tombi-text, tombi-gfx, tombi-assets)"
        type: boolean
        default: false
      version:
        description: "version X.Y.Z (optional; default: latest patch + 1, e.g. 0.0.N)"
        type: string
        default: ""
      migrate_dev:
        description: "only mark old build-* releases as pre-release 'dev build ...' (no new release)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      MIN_COMMITS: 5
    steps:
      # first: a later checkout would clean the downloaded artifacts away
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/release_notes.py reads the history between the two tags

      - name: Decide
        id: d
        run: |
          SHA=$(gh api "repos/$R/commits/master" --jq .sha)
          PREV=$(gh api "repos/$R/releases?per_page=100" --jq '.[].tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          LAST=${PREV#v}; LAST=${LAST:-0.0.0}
          # VERSION (repo root) is the number baked into the Android launcher: the release uses it unless overridden
          FILEVER=$(tr -d ' \r\n' < VERSION 2>/dev/null || true)
          IN="${{ inputs.version }}"; IN=${IN#v}; IN=${IN:-$FILEVER}
          [ -z "$FILEVER" ] || [ "$IN" = "$FILEVER" ] || echo "::warning::version $IN differs from VERSION ($FILEVER): the APK shows v$FILEVER"
          if [ -n "$IN" ]; then
            [[ "$IN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$IN' is not X.Y.Z"; exit 1; }
            [ "$IN" != "$LAST" ] && [ "$(printf '%s\n%s\n' "$LAST" "$IN" | sort -V | tail -n1)" = "$IN" ] || { echo "::error::version $IN must be greater than $LAST"; exit 1; }
            VER=$IN
          else IFS=. read -r a b c <<< "$LAST"; VER="$a.$b.$((c + 1))"; fi
          if [ "${{ inputs.migrate_dev }}" = true ]; then echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -n "$PREV" ] && [ "$(gh api "repos/$R/releases/tags/$PREV" --jq .target_commitish 2>/dev/null)" = "$SHA" ] && { echo "$SHA already released as $PREV"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          if gh api "repos/$R/releases/tags/v$VER" >/dev/null 2>&1; then echo "v$VER already released"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -n "$PREV" ] || PREV=$(gh api "repos/$R/releases?per_page=100" --jq '[.[] | select(.tag_name | startswith("build-"))][0].tag_name // empty')
          if [ -z "$PREV" ]; then n=0; else   # no release yet: only on request
            n=$(gh api "repos/$R/compare/$PREV...$SHA" --jq '[.commits[] | .commit.message | split("\n")[0] | select(test("^(ci|dist)[:(]") | not)] | length')
          fi
          busy=0
          for wf in port2-exe.yml android-apk.yml; do
            for st in queued in_progress; do
              busy=$((busy + $(gh api "repos/$R/actions/workflows/$wf/runs?branch=master&status=$st" --jq .total_count)))
            done
          done
          if [ "$busy" -gt 0 ]; then echo "$busy build runs still going: the last one to finish decides"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$n non-CI commits since ${PREV:-<none>} (need $MIN_COMMITS)"
          [ "$n" -ge "$MIN_COMMITS" ] && echo "go=1" >> "$GITHUB_OUTPUT" || echo "go=0" >> "$GITHUB_OUTPUT"

      - name: Collect the newest green builds
        if: steps.d.outputs.go == '1'
        run: |
          TOOLS="port:port2-exe.yml"
          [ "${{ inputs.include_tools }}" = true ] && TOOLS="$TOOLS assets:assets-exe.yml gfx:gfx-exe.yml text:text-exe.yml"
          for t in $TOOLS; do
            tool=${t%%:*}; wf=${t#*:}
            for plat in windows linux; do
              run=""
              for id in $(gh api "repos/$R/actions/workflows/$wf/runs?branch=master&status=success&per_page=20" --jq '.workflow_runs[].id'); do
                if gh api "repos/$R/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.expired | not) | .name' | grep -qx "bin-$plat-$tool"; then run=$id; break; fi
              done
              [ -n "$run" ] || { echo "::error::no artifact bin-$plat-$tool"; exit 1; }
              gh run download "$run" -R "$R" -n "bin-$plat-$tool" -D "art/$plat-$tool"
              echo "bin-$plat-$tool <- run $run"
            done
          done
          # the Android APK of the newest green android-apk run (signed with the project key when the secrets exist)
          run=""
          for id in $(gh api "repos/$R/actions/workflows/android-apk.yml/runs?branch=master&status=success&per_page=20" --jq '.workflow_runs[].id'); do
            if gh api "repos/$R/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.expired | not) | .name' | grep -qx "tombi-port-android"; then run=$id; break; fi
          done
          [ -n "$run" ] || { echo "::error::no artifact tombi-port-android"; exit 1; }
          gh run download "$run" -R "$R" -n tombi-port-android -D art/android
          echo "tombi-port-android <- run $run"
          find art -type f | xargs ls -l

      - name: Package and publish
        if: steps.d.outputs.go == '1'
        run: |
          VER=${{ steps.d.outputs.ver }}; SHA=${{ steps.d.outputs.sha }}; PREV=${{ steps.d.outputs.prev }}
          mkdir out
          cp art/windows-port/tombi-port.exe "out/tombi-port-$VER-windows-x64.exe"
          mkdir pl && cp art/linux-port/tombi-port pl/ && chmod +x pl/tombi-port
          tar -C pl -czf "out/tombi-port-$VER-linux-x64.tar.gz" tombi-port
          # one APK, both ABIs; never publish one without the 64-bit libraries (64-bit-only devices cannot install it)
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l art/android/tombi-port-android-debug.apk | grep -q " lib/$abi/libtombi.so$" || { echo "::error::the APK has no lib/$abi/libtombi.so"; exit 1; }
          done
          cp art/android/tombi-port-android-debug.apk "out/tombi-port-$VER-android.apk"
          if [ -d art/windows-text ]; then
            mkdir tw tl
            cp art/windows-assets/*.exe art/windows-gfx/*.exe art/windows-text/*.exe tw/
            cp art/linux-assets/tombi-* art/linux-gfx/tombi-* art/linux-text/tombi-* tl/ && chmod +x tl/*
            (cd tw && zip -9 -q "../out/Tombi-Tools-$VER-windows-x64.zip" *.exe)
            tar -C tl -czf "out/Tombi-Tools-$VER-linux-x64.tar.gz" .
          fi
          {
            echo "Tombi port $VER (build of ${SHA::7}): PC (Windows, Linux) and Android."; echo
            if [ -n "$PREV" ]; then echo "### Changes since $PREV"
              python3 tools/release_notes.py "$PREV" "$SHA"   # player-facing commits only (see the script)
            else echo "### Commit"; gh api "repos/$R/commits/$SHA" --jq '"- " + (.commit.message | split("\n")[0])'; fi
            echo; echo "### Assets"
            # the games each PC bundle runs (versions.txt of port2-exe: pal, plus usa when GAME_FILES_URL_USA was set)
            games() { if grep -qx usa "art/$1-port/versions.txt" 2>/dev/null; then echo "Tombi! PAL (SCES-01331 / SCES-01330) and Tomba! USA (SCUS-94236) discs"; else echo "Tombi! PAL discs (SCES-01331 / SCES-01330)"; fi; }
            echo "- \`tombi-port-$VER-windows-x64.exe\`: native port with launcher (Windows): $(games windows)"
            echo "- \`tombi-port-$VER-linux-x64.tar.gz\`: \`tombi-port\` (Linux; the game is i386, see README): $(games linux)"
            echo "- \`tombi-port-$VER-android.apk\`: Android, one APK for 64-bit ARM (arm64-v8a, including 64-bit-only devices such as Snapdragon 8 Gen 3 and newer) and 32-bit ARM (armeabi-v7a). No game data: pick your own PAL disc image (SCES-01331) in the app."
            [ -d tw ] && echo "- \`Tombi-Tools-$VER-windows-x64.zip\` / \`-linux-x64.tar.gz\`: $(cd tw && ls | tr '\n' ' ')"
            true
          } > notes.md
          cat notes.md
          gh release create "v$VER" -R "$R" --target "$SHA" --title "Tombi port $VER" --latest --notes-file notes.md out/*

      - name: Move build-* releases to dev (pre-release, "dev build YYYYMMDD-<sha7>")
        if: steps.d.outputs.go == '1' || inputs.migrate_dev
        run: |
          for t in $(gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.tag_name | startswith("build-")) | select((.prerelease | not) or (.name | startswith("dev build") | not)) | .tag_name'); do
            gh release edit "$t" -R "$R" --prerelease --latest=false --title "dev build ${t#build-}" && echo "dev: $t"
          done
          L=$(gh api "repos/$R/releases?per_page=100" --jq '.[].tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          [ -n "$L" ] && gh release edit "$L" -R "$R" --latest || true

      - name: Remove legacy releases (rolling "latest", build-* without the tombi-port-* assets)
        if: steps.d.outputs.go == '1'
        run: |
          gh release delete latest -R "$R" --yes --cleanup-tag 2>/dev/null || true
          for t in $(gh api "repos/$R/releases?per_page=100" --jq '.[] | select((.tag_name | startswith("build-")) and ([.assets[].name | startswith("tombi-port-")] | any | not)) | .tag_name'); do
            gh release delete "$t" -R "$R" --yes --cleanup-tag && echo "deleted $t"
          done
