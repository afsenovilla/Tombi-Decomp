name: Native port (Windows exe)

# Builds the native-pointer port (docs/PORT.md "M3 phase 3") for Windows: tombi-pc.exe (the game, CMake target tombi2, cross-compiled with
# mingw-w64 on Linux: port2/cmake/mingw-i686.cmake) and the launcher tools/port_launcher.py (PyInstaller, on Windows)
# that bundles it with SDL2.dll into dist/windows/tombi-port.exe.  The generator takes the retail addresses and the
# data image from the player's own game files like report.yml (GAME_FILES_URL secret, the whole disc image), so NO
# game data ends up in the artifact: only our code, SDL2.dll (zlib licence, THIRD_PARTY_NOTICES.md) and the launcher
# (the image's MAIN0/X000 bytes are compiled into tombi-pc.exe: it is built from the player's own copy, and the exe
# published here is the one the repository owner built from theirs).
on:
  push:
    branches: [master]
    paths:
      - port2/**
      - port/tools/gen_port.py
      - port/fixes.txt
      - port/cmake/build_id.cmake
      - tools/port_launcher.py
      - tools/port_mods.py
      - tools/extract_data.py
      - tools/chd.py
      - tools/data_patch.py
      - tools/text_patch.py
      - tools/text_core.py
      - tools/wfm_py.py
      - tools/text_strings.py
      - tools/title_layout.py
      - tools/verb_order.py
      - tools/cdfiles.py
      - tools/wfm_charmap.json
      - patches/es_mejorada.tombipatch.json
      - tools/prompt_glyphs.py
      - tools/gfx_es/**
      - tools/i18n.py
      - tools/icons/**
      - .github/workflows/port2-exe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port2-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL2_VERSION: "2.30.11"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 400M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      game: ${{ steps.key.outputs.game }}
      full: ${{ steps.key.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache keys
        id: key
        run: |
          # full: inputs of tools/build_full.py; game: those plus the port generator/runtime and the toolchain setup
          echo "full=v1-${{ hashFiles('src/**', 'include/**', 'asm/**', 'config/**', 'tools/build_full.py', 'tools/ncheck.py', 'tools/sysovl.py', 'tools/requirements.txt', 'tools/setup_native.sh') }}" >> "$GITHUB_OUTPUT"
          echo "game=v1-${{ env.SDL2_VERSION }}-${{ hashFiles('src/**', 'include/**', 'asm/**', 'config/**', 'tools/build_full.py', 'tools/ncheck.py', 'tools/sysovl.py', 'tools/areas.py', 'tools/units.py', 'tools/requirements.txt', 'tools/setup_native.sh', 'port2/**', 'port/**', 'tools/extract_data.py', 'THIRD_PARTY_NOTICES.md') }}" >> "$GITHUB_OUTPUT"

  game-win:
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.ok.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      # The finished game binaries, keyed by every input of the game build (plan job): a push that touches only the
      # launcher / tools Python reuses them and goes straight to PyInstaller (no disc download, no compile).
      - name: Restore built game
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: build/win-bin
          key: tombi-port-game-${{ needs.plan.outputs.game }}

      - uses: actions/setup-python@v5
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Install toolchain
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu libyaml-dev gcc-mingw-w64-i686 ninja-build cmake ccache gcc-multilib libsdl2-dev libsdl2-2.0-0:i386 patchelf
          python3 -m pip install -r tools/requirements.txt
          python3 -m pip install --no-deps splat64==0.35.2
          python3 -c "import site,os; open(os.path.join(site.getsitepackages()[0],'pylibyaml.py'),'w').write('# optional accelerator stub\n')"
          sudo tools/setup_native.sh
          mkdir -p "$RUNNER_TEMP/sdl"
          curl -fsSL -o "$RUNNER_TEMP/sdl/sdl.tar.gz" "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          tar xzf "$RUNNER_TEMP/sdl/sdl.tar.gz" -C "$RUNNER_TEMP/sdl"

      - name: Fetch game files
        id: fetch
        if: steps.bin.outputs.cache-hit != 'true'
        env:
          GAME_FILES_URL: ${{ secrets.GAME_FILES_URL }}
        run: |
          # The same download as report.yml: a raw disc image (.bin) of your own copy, never committed.
          if [ -z "$GAME_FILES_URL" ]; then
            echo "::notice::GAME_FILES_URL secret not set; skipping the port build."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          URL="$(printf '%s' "$GAME_FILES_URL" | tr -d '\r\n"'"'"' ')"
          ID="$(printf '%s' "$URL" | sed -nE 's#.*drive\.google\.com/(file/d/|open\?id=|uc\?.*id=)([A-Za-z0-9_-]+).*#\2#p')"
          if [ -z "$ID" ] && ! printf '%s' "$URL" | grep -q '://'; then ID="$URL"; fi
          if [ -n "$ID" ]; then URL="https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"; fi
          curl -fsSL -o "$RUNNER_TEMP/game.dl" "$URL"
          if [ "$(stat -c%s "$RUNNER_TEMP/game.dl")" -lt 100000000 ]; then
            echo "::error::The port build needs the whole disc image (the generator reads every area and SYSTEM overlay)."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/game"
          python3 -I tools/isoext.py "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/game"
          mkdir -p game/disc/fs
          cp -r "$RUNNER_TEMP/game"/. game/disc/fs/
          cp "$(find "$RUNNER_TEMP/game" -iname MAIN0.EXE | head -1)" game/MAIN0.EXE
          for a in 00 01 02 03 04 05 06 08 09 10 11 13 14 16 17 18 19; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*AREA$a/X0$a.BIN" | head -1)"
            mkdir -p "game/AREA$a"; cp "$f" "game/AREA$a/X0$a.BIN"
          done
          mkdir -p game/disc/fs/SYSTEM
          for s in O0PTSUB0 D0SPSUB D0SPSUB2 D0SPSUB3 G0OVER I0NFO I0NFO2 I0NFO3; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*SYSTEM/$s.BIN" | head -1)"; cp "$f" "game/disc/fs/SYSTEM/$s.BIN"
          done
          echo "bec8dc5f4116f5e497f2337eef8c523ff6dee8fc  game/MAIN0.EXE" | sha1sum -c -
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Extract data/ from the disc (the runtime's data path, tools/extract_data.py)
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        run: |
          # The same extraction the launcher runs once on the player's disc: every file plus manifest.txt.  Checked
          # against the manifest (sizes, every sector covered) and against the ISO dump above; the exe is run from it
          # on the Windows job (tombi2 is a Windows build here, so the headless run with --data is a smoke test only).
          python3 -I tools/extract_data.py "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/data" --quiet
          python3 -I tools/extract_data.py --check "$RUNNER_TEMP/data"
          grep -q "^main0_sha1 bec8dc5f4116f5e497f2337eef8c523ff6dee8fc$" "$RUNNER_TEMP/data/manifest.txt"
          cmp "$RUNNER_TEMP/data/EXE/MAIN0.EXE" game/MAIN0.EXE
          cmp "$RUNNER_TEMP/data/AREA00/X000.BIN" game/AREA00/X000.BIN
          mkdir -p build/data-sample/EXE build/data-sample/_disc
          # a tiny data/ for the Windows smoke test: the manifest plus MAIN0 and the PVD blob (no game data is uploaded
          # beyond the two files the exe is built from and the ISO descriptor sectors; the artifact is never published)
          cp "$RUNNER_TEMP/data/manifest.txt" build/data-sample/
          cp "$RUNNER_TEMP/data/EXE/MAIN0.EXE" build/data-sample/EXE/
          cp "$RUNNER_TEMP/data/_disc/000000.raw" build/data-sample/_disc/

      # build/full (the matching build) depends only on the decomp sources and the (sha1-checked) retail files:
      # exact-key cache, no restore-keys (a stale tree must never feed the generator).
      - name: Restore matching build
        id: full
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/full
            build/*.EXE
            build/*.BIN
            !build/full/tmp
          key: full-${{ needs.plan.outputs.full }}

      - name: Matching build (retail addresses for the generator)
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true' && steps.full.outputs.cache-hit != 'true'
        run: python3 tools/build_full.py -j "$(nproc)"

      - name: Save matching build
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true' && steps.full.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/full
            build/*.EXE
            build/*.BIN
            !build/full/tmp
          key: full-${{ needs.plan.outputs.full }}

      - name: Restore ccache
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-win-${{ github.sha }}
          restore-keys: ccache-win-

      - name: Build tombi-pc.exe (the game; CMake target tombi2)
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        run: |
          cmake -S port2 -B build/port2-win -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/port2/cmake/mingw-i686.cmake" \
                -DPORT_SDL2_MINGW="$RUNNER_TEMP/sdl/SDL2-${SDL2_VERSION}/i686-w64-mingw32"
          ninja -C build/port2-win -j "$(nproc)"
          ccache -s || true
          cat build/port2-win/gen/report.txt | head -12
          mkdir -p build/win-bin
          cp build/port2-win/tombi2.exe build/win-bin/tombi-pc.exe; cp "$RUNNER_TEMP/sdl/SDL2-${SDL2_VERSION}/i686-w64-mingw32/bin/SDL2.dll" build/win-bin/
          cp -r build/data-sample build/win-bin/data-sample
          cp "$RUNNER_TEMP/sdl/SDL2-${SDL2_VERSION}/i686-w64-mingw32/share/licenses/SDL2/LICENSE.txt" build/win-bin/SDL2-LICENSE.txt || true
          ls -l build/win-bin

      - name: Save ccache
        if: always() && steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-win-${{ github.sha }}

      - name: Save built game
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: build/win-bin
          key: tombi-port-game-${{ needs.plan.outputs.game }}

      - name: Result
        id: ok
        run: |
          if [ "${{ steps.bin.outputs.cache-hit }}" = "true" ] || [ "${{ steps.fetch.outputs.ok }}" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.ok.outputs.ok == 'true'
        with:
          name: tombi-port-game
          path: build/win-bin

  game-linux:
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.ok.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      # The finished game binaries, keyed by every input of the game build (plan job): a push that touches only the
      # launcher / tools Python reuses them and goes straight to PyInstaller (no disc download, no compile).
      - name: Restore built game
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: build/linux-bin
          key: tombi-port-game-linux-${{ needs.plan.outputs.game }}

      - uses: actions/setup-python@v5
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Install toolchain
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu libyaml-dev gcc-mingw-w64-i686 ninja-build cmake ccache gcc-multilib libsdl2-dev libsdl2-2.0-0:i386 patchelf
          python3 -m pip install -r tools/requirements.txt
          python3 -m pip install --no-deps splat64==0.35.2
          python3 -c "import site,os; open(os.path.join(site.getsitepackages()[0],'pylibyaml.py'),'w').write('# optional accelerator stub\n')"
          sudo tools/setup_native.sh
          mkdir -p "$RUNNER_TEMP/sdl"
          curl -fsSL -o "$RUNNER_TEMP/sdl/sdl.tar.gz" "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          tar xzf "$RUNNER_TEMP/sdl/sdl.tar.gz" -C "$RUNNER_TEMP/sdl"

      - name: Fetch game files
        id: fetch
        if: steps.bin.outputs.cache-hit != 'true'
        env:
          GAME_FILES_URL: ${{ secrets.GAME_FILES_URL }}
        run: |
          # The same download as report.yml: a raw disc image (.bin) of your own copy, never committed.
          if [ -z "$GAME_FILES_URL" ]; then
            echo "::notice::GAME_FILES_URL secret not set; skipping the port build."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          URL="$(printf '%s' "$GAME_FILES_URL" | tr -d '\r\n"'"'"' ')"
          ID="$(printf '%s' "$URL" | sed -nE 's#.*drive\.google\.com/(file/d/|open\?id=|uc\?.*id=)([A-Za-z0-9_-]+).*#\2#p')"
          if [ -z "$ID" ] && ! printf '%s' "$URL" | grep -q '://'; then ID="$URL"; fi
          if [ -n "$ID" ]; then URL="https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"; fi
          curl -fsSL -o "$RUNNER_TEMP/game.dl" "$URL"
          if [ "$(stat -c%s "$RUNNER_TEMP/game.dl")" -lt 100000000 ]; then
            echo "::error::The port build needs the whole disc image (the generator reads every area and SYSTEM overlay)."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/game"
          python3 -I tools/isoext.py "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/game"
          mkdir -p game/disc/fs
          cp -r "$RUNNER_TEMP/game"/. game/disc/fs/
          cp "$(find "$RUNNER_TEMP/game" -iname MAIN0.EXE | head -1)" game/MAIN0.EXE
          for a in 00 01 02 03 04 05 06 08 09 10 11 13 14 16 17 18 19; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*AREA$a/X0$a.BIN" | head -1)"
            mkdir -p "game/AREA$a"; cp "$f" "game/AREA$a/X0$a.BIN"
          done
          mkdir -p game/disc/fs/SYSTEM
          for s in O0PTSUB0 D0SPSUB D0SPSUB2 D0SPSUB3 G0OVER I0NFO I0NFO2 I0NFO3; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*SYSTEM/$s.BIN" | head -1)"; cp "$f" "game/disc/fs/SYSTEM/$s.BIN"
          done
          echo "bec8dc5f4116f5e497f2337eef8c523ff6dee8fc  game/MAIN0.EXE" | sha1sum -c -
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Extract data/ from the disc (the runtime's data path, tools/extract_data.py)
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        run: |
          # The same extraction the launcher runs once on the player's disc: every file plus manifest.txt.  Checked
          # against the manifest (sizes, every sector covered) and against the ISO dump above; the exe is run from it
          # on the Windows job (tombi2 is a Windows build here, so the headless run with --data is a smoke test only).
          python3 -I tools/extract_data.py "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/data" --quiet
          python3 -I tools/extract_data.py --check "$RUNNER_TEMP/data"
          grep -q "^main0_sha1 bec8dc5f4116f5e497f2337eef8c523ff6dee8fc$" "$RUNNER_TEMP/data/manifest.txt"
          cmp "$RUNNER_TEMP/data/EXE/MAIN0.EXE" game/MAIN0.EXE
          cmp "$RUNNER_TEMP/data/AREA00/X000.BIN" game/AREA00/X000.BIN
          mkdir -p build/data-sample/EXE build/data-sample/_disc
          # a tiny data/ for the Windows smoke test: the manifest plus MAIN0 and the PVD blob (no game data is uploaded
          # beyond the two files the exe is built from and the ISO descriptor sectors; the artifact is never published)
          cp "$RUNNER_TEMP/data/manifest.txt" build/data-sample/
          cp "$RUNNER_TEMP/data/EXE/MAIN0.EXE" build/data-sample/EXE/
          cp "$RUNNER_TEMP/data/_disc/000000.raw" build/data-sample/_disc/

      # build/full (the matching build) depends only on the decomp sources and the (sha1-checked) retail files:
      # exact-key cache, no restore-keys (a stale tree must never feed the generator).
      - name: Restore matching build
        id: full
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/full
            build/*.EXE
            build/*.BIN
            !build/full/tmp
          key: full-${{ needs.plan.outputs.full }}

      - name: Matching build (retail addresses for the generator)
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true' && steps.full.outputs.cache-hit != 'true'
        run: python3 tools/build_full.py -j "$(nproc)"

      - name: Save matching build
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true' && steps.full.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/full
            build/*.EXE
            build/*.BIN
            !build/full/tmp
          key: full-${{ needs.plan.outputs.full }}

      - name: Restore ccache
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Build tombi-pc (the Linux game, i386; CMake target tombi2)
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        run: |
          # The same policy as the Windows exe: MAIN0/X000 bytes are compiled in from the secret's disc image, nothing else.
          cmake -S port2 -B build/port2 -G Ninja
          ninja -C build/port2 -j "$(nproc)"
          ccache -s || true
          mkdir -p build/linux-bin
          cp build/port2/tombi2 build/linux-bin/tombi-pc
          # bundle the 32-bit libSDL2 next to it (few desktops have libsdl2-2.0-0:i386) and look it up via $ORIGIN
          cp -L /usr/lib/i386-linux-gnu/libSDL2-2.0.so.0 build/linux-bin/
          patchelf --set-rpath '$ORIGIN' build/linux-bin/tombi-pc
          file build/linux-bin/tombi-pc; ldd build/linux-bin/tombi-pc || true
          build/linux-bin/tombi-pc --headless --test-null
          build/linux-bin/tombi-pc --headless --frames 200 --data build/data-sample 2>&1 | grep -i 'data:\|warning\|violation' | head -5 || true
          cp THIRD_PARTY_NOTICES.md build/linux-bin/
          ls -l build/linux-bin

      - name: Save ccache
        if: always() && steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}

      - name: Save built game
        if: steps.bin.outputs.cache-hit != 'true' && steps.fetch.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-bin
          key: tombi-port-game-linux-${{ needs.plan.outputs.game }}

      - name: Result
        id: ok
        run: |
          if [ "${{ steps.bin.outputs.cache-hit }}" = "true" ] || [ "${{ steps.fetch.outputs.ok }}" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.ok.outputs.ok == 'true'
        with:
          name: tombi-port-game-linux
          path: build/linux-bin

  launcher:
    needs: game-win
    if: needs.game-win.outputs.ok == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: tombi-port-game
          path: build/win-bin

      - name: Smoke test tombi-pc.exe (fault handlers, headless boot)
        shell: bash
        run: |
          build/win-bin/tombi-pc.exe --headless --test-null
          build/win-bin/tombi-pc.exe --headless --frames 200 --disc nonexistent.bin 2>&1 | head -5 || true
          # the data/ path: a manifest with MAIN0 and the PVD blob only (every other read is zeros, logged), and a
          # missing folder (must say so and exit, not crash)
          build/win-bin/tombi-pc.exe --headless --frames 200 --data build/win-bin/data-sample 2>&1 | grep -i 'data:\|warning\|violation' | head -5 || true
          build/win-bin/tombi-pc.exe --headless --frames 10 --data nonexistent 2>&1 | grep -i 'FATAL' || true
          rm -rf build/win-bin/data-sample
          # the OpenGL renderer on the runner's desktop (no GPU driver: the GDI OpenGL 1.1 cannot make the context,
          # which must fall back to the software rasteriser, not fail)
          build/win-bin/tombi-pc.exe --headless --renderer gl --frames 100 --disc nonexistent.bin 2>&1 | grep -i 'renderer\|opengl' || true

      - name: Build tombi-port.exe
        shell: bash
        run: |
          python -m pip install pyinstaller pillow
          echo "${GITHUB_SHA::7}" > build_id.txt
          pyinstaller --onefile --windowed --name tombi-port --distpath build/exe --workpath build/pyi --specpath . \
            --hidden-import i18n --hidden-import port_mods --hidden-import extract_data --hidden-import chd --hidden-import data_patch --hidden-import text_patch --hidden-import text_core --hidden-import text_strings --hidden-import wfm_py --hidden-import title_layout --hidden-import verb_order --hidden-import cdfiles --hidden-import prompt_glyphs --hidden-import gfx_es --hidden-import gfx_es.tryagain --hidden-import gfx_es.cargar_guardar --hidden-import gfx_es.cargando --hidden-import area000 --hidden-import dump_all_textures --hidden-import vram --hidden-import wpp --hidden-import PIL.ImageDraw --hidden-import PIL.ImageFilter --hidden-import PIL.ImageFont --paths tools \
            --icon tools/icons/launcher.ico --add-data "tools/icons/launcher.ico;icons" --add-data "tools/icons/launcher.png;icons" --add-data "build_id.txt;." \
            --add-data "port/assets/prompts/manifest.json;port/assets/prompts" \
            --add-data "tools/wfm_charmap.json;." --add-data "patches/es_mejorada.tombipatch.json;patches" \
            --add-binary "build/win-bin/tombi-pc.exe;." --add-binary "build/win-bin/SDL2.dll;." \
            tools/port_launcher.py
          mkdir -p dist/windows build/out
          cp build/exe/tombi-port.exe dist/windows/tombi-port.exe
          cp build/exe/tombi-port.exe build/win-bin/tombi-pc.exe build/win-bin/SDL2.dll build/out/
          cp THIRD_PARTY_NOTICES.md build/out/

      - uses: actions/upload-artifact@v4
        with:
          name: tombi-port-windows
          path: build/out

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/windows/tombi-port.exe

  launcher-linux:
    needs: game-linux
    if: needs.game-linux.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: tombi-port-game-linux
          path: build/linux-bin

      - name: Build tombi-port (Linux)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libsdl2-2.0-0:i386   # (Ubuntu's libSDL2 links ALSA/Pulse/X11 directly: the user needs this too, README)
          chmod +x build/linux-bin/tombi-pc
          build/linux-bin/tombi-pc --headless --test-null
          python -m pip install pyinstaller pillow
          python -c "import tkinter"
          echo "${GITHUB_SHA::7}" > build_id.txt
          pyinstaller --onefile --windowed --name tombi-port --distpath build/exe --workpath build/pyi --specpath . \
            --hidden-import i18n --hidden-import port_mods --hidden-import extract_data --hidden-import chd --hidden-import data_patch --hidden-import text_patch --hidden-import text_core --hidden-import text_strings --hidden-import wfm_py --hidden-import title_layout --hidden-import verb_order --hidden-import cdfiles --hidden-import prompt_glyphs --hidden-import gfx_es --hidden-import gfx_es.tryagain --hidden-import gfx_es.cargar_guardar --hidden-import gfx_es.cargando --hidden-import area000 --hidden-import dump_all_textures --hidden-import vram --hidden-import wpp --hidden-import PIL.ImageDraw --hidden-import PIL.ImageFilter --hidden-import PIL.ImageFont --hidden-import PIL.ImageTk --paths tools \
            --add-data "tools/icons/launcher.ico:icons" --add-data "tools/icons/launcher.png:icons" --add-data "build_id.txt:." \
            --add-data "port/assets/prompts/manifest.json:port/assets/prompts" \
            --add-data "tools/wfm_charmap.json:." --add-data "patches/es_mejorada.tombipatch.json:patches" \
            --add-binary "build/linux-bin/tombi-pc:." --add-binary "build/linux-bin/libSDL2-2.0.so.0:." \
            tools/port_launcher.py
          mkdir -p dist/linux
          cp build/exe/tombi-port dist/linux/tombi-port
          chmod +x dist/linux/tombi-port

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/linux/tombi-port

  commit:
    # one job pushes both binaries (no racing pushes between the Windows and Linux jobs)
    needs: [launcher, launcher-linux]
    if: always() && (needs.launcher.result == 'success' || needs.launcher-linux.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.launcher.result == 'success'
        with:
          name: dist-windows
          path: dist/windows

      - uses: actions/download-artifact@v4
        if: needs.launcher-linux.result == 'success'
        with:
          name: dist-linux
          path: dist/linux

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          n=0
          if [ "${{ needs.launcher.result }}" = "success" ]; then
            git add -f dist/windows/tombi-port.exe
            if git diff --cached --quiet; then echo "exe unchanged"
            else git commit -q -m "dist: rebuild tombi-port.exe (${GITHUB_SHA::7})"; n=1; fi
          fi
          if [ "${{ needs.launcher-linux.result }}" = "success" ]; then
            chmod +x dist/linux/tombi-port
            git add -f dist/linux/tombi-port
            if git diff --cached --quiet; then echo "binary unchanged"
            else git commit -q -m "dist: rebuild linux tombi-port (${GITHUB_SHA::7})"; n=1; fi
          fi
          [ "$n" = 1 ] || exit 0
          for i in 1 2 3 4 5; do
            git pull --no-rebase -q -X theirs origin master && git push origin HEAD:master && exit 0
            sleep $((i * 10))
          done
          exit 1
