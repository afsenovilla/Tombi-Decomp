name: Native port (Android APK)

# Builds the native-pointer port (port2/) for Android handhelds (docs/PORT.md "4. Android"): SDL2's android-project
# (port2/android, Gradle + NDK) around port2/CMakeLists.txt, ONE APK with both ABIs: armeabi-v7a (the native 32-bit
# build) and arm64-v8a (the wasm2c build, docs/PORT.md "64-bit builds: wasm2c": the game compiled to wasm32 with clang +
# wasi-libc, translated to C by WABT's wasm2c, compiled for arm64 with the NDK; 64-bit-only devices need it).  The runner's preinstalled Android SDK/NDK
# are used; SDL2 is the pinned release source tarball from GitHub (never vendored).  Like port2-exe.yml, the generator
# takes the retail addresses and the MAIN0/X000 image from the owner's own disc (GAME_FILES_URL secret), so the game
# code in libtombi.so is built from that copy; the APK carries NO game data files (the player picks their own disc image
# on the device in the launcher; it is the only game source).
on:
  push:
    branches: [master]
    paths:
      - port2/**
      - port/tools/gen_port.py
      - port/fixes.txt
      - .github/workflows/android-apk.yml
      - VERSION
  workflow_dispatch:
    inputs:
      publish:
        description: "publish the APK as a BETA pre-release (android-beta-<run_number>), not 'Latest'"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL2_VERSION: "2.30.11"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/disc-cache   # the USA disc stays in the Actions cache between runs (tools/disc_fetch.sh)
        with:
          urls: ${{ secrets.GAME_FILES_URL_USA }}
          scope: usa

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain (matching build + generator)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu libyaml-dev ninja-build
          # the arm64-v8a build's wasm32 step (port2/wasm/build.py): clang/lld/llvm 18, wasi-libc, the wasm32 builtins
          sudo apt-get install -y clang-18 lld-18 llvm-18 wasi-libc libclang-rt-18-dev-wasm32
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          python3 -m pip install -r tools/requirements.txt
          python3 -m pip install --no-deps splat64==0.35.2
          python3 -c "import site,os; open(os.path.join(site.getsitepackages()[0],'pylibyaml.py'),'w').write('# optional accelerator stub\n')"
          sudo tools/setup_native.sh
          echo "NDK: $ANDROID_NDK_LATEST_HOME"; ls "$ANDROID_HOME/cmake" || true

      # the disc image is kept in the Actions cache: Google Drive refuses downloads for a while after many in a row
      # (its quota page then arrives instead of the image), and the image never changes
      - name: Restore disc image
        id: disccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/disccache
          key: disc-pal-v1

      - name: Fetch game files
        id: fetch
        env:
          GAME_FILES_URL: ${{ secrets.GAME_FILES_URL2 || secrets.GAME_FILES_URL }}   # URL2: Dropbox (Drive throttles)
        run: |
          # The same download as report.yml / port2-exe.yml: a raw disc image (.bin) of your own copy, never committed.
          if [ -z "$GAME_FILES_URL" ]; then
            echo "::notice::GAME_FILES_URL secret not set; skipping the APK build."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          URL="$(printf '%s' "$GAME_FILES_URL" | tr -d '\r\n"'"'"' ')"
          URL="$(printf '%s' "$URL" | sed -E 's#(dropbox\.com/.*[?&])dl=0#\1dl=1#')"   # Dropbox share link -> direct download
          mkdir -p "$RUNNER_TEMP/disccache"
          if [ -s "$RUNNER_TEMP/disccache/game.bin" ]; then cp "$RUNNER_TEMP/disccache/game.bin" "$RUNNER_TEMP/game.dl"
          else bash tools/ci_download.sh "$URL" "$RUNNER_TEMP/game.dl" 100000000; fi
          if [ "$(stat -c%s "$RUNNER_TEMP/game.dl")" -lt 100000000 ]; then
            echo "::error::The port build needs the whole disc image (the generator reads every area and SYSTEM overlay)."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/game"
          python3 -I tools/isoext.py "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/game"
          mkdir -p game/disc/fs
          cp -r "$RUNNER_TEMP/game"/. game/disc/fs/
          cp "$(find "$RUNNER_TEMP/game" -iname MAIN0.EXE | head -1)" game/MAIN0.EXE
          for a in 00 01 02 03 04 05 06 08 09 10 11 13 14 16 17 18 19; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*AREA$a/X0$a.BIN" | head -1)"
            mkdir -p "game/AREA$a"; cp "$f" "game/AREA$a/X0$a.BIN"
          done
          mkdir -p game/disc/fs/SYSTEM
          for s in O0PTSUB0 D0SPSUB D0SPSUB2 D0SPSUB3 G0OVER I0NFO I0NFO2 I0NFO3; do
            f="$(find "$RUNNER_TEMP/game" -ipath "*SYSTEM/$s.BIN" | head -1)"; cp "$f" "game/disc/fs/SYSTEM/$s.BIN"
          done
          [ -s "$RUNNER_TEMP/disccache/game.bin" ] || mv "$RUNNER_TEMP/game.dl" "$RUNNER_TEMP/disccache/game.bin"
          rm -f "$RUNNER_TEMP/game.dl"
          echo "bec8dc5f4116f5e497f2337eef8c523ff6dee8fc  game/MAIN0.EXE" | sha1sum -c -
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # build/full: the same exact-key cache as port2-exe.yml (inputs of tools/build_full.py only)

      - name: Save disc image
        if: steps.fetch.outputs.ok == 'true' && steps.disccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/disccache
          key: disc-pal-v1
      - name: Cache key
        id: key
        run: echo "full=v1-${{ hashFiles('src/**', 'include/**', 'asm/**', 'config/**', 'tools/build_full.py', 'tools/ncheck.py', 'tools/sysovl.py', 'tools/requirements.txt', 'tools/setup_native.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore matching build
        id: full
        if: steps.fetch.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/full
            build/*.EXE
            build/*.BIN
            !build/full/tmp
          key: full-${{ steps.key.outputs.full }}

      - name: Matching build (retail addresses for the generator)
        if: steps.fetch.outputs.ok == 'true' && steps.full.outputs.cache-hit != 'true'
        run: python3 tools/build_full.py -j "$(nproc)"

      - name: Touch restored matching build
        if: steps.full.outputs.cache-hit == 'true'
        run: find build/full -type f -exec touch {} +; touch build/*.EXE build/*.BIN 2>/dev/null || true

      - name: Save matching build
        if: steps.fetch.outputs.ok == 'true' && steps.full.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/full
            build/*.EXE
            build/*.BIN
            !build/full/tmp
          key: full-${{ steps.key.outputs.full }}

      # WABT's wasm2c (pinned tag in port2/wasm/build.py), built once and cached: the binary and its runtime sources
      - name: Restore wasm2c (WABT)
        if: steps.fetch.outputs.ok == 'true'
        id: wabt
        uses: actions/cache/restore@v4
        with:
          path: |
            build/wasm/wabt-build/wasm2c
            build/wasm/wabt-src/wasm2c
          key: wabt-1.0.36-ubuntu-24.04-v1

      - name: wasm2c build of the game (arm64-v8a sources)
        if: steps.fetch.outputs.ok == 'true'
        run: |
          python3 port2/wasm/build.py -j "$(nproc)" --until w2c
          ls -l build/wasm/tombi2.wasm build/wasm/w2c
          echo "PORT2_W2C_DIR=$PWD/build/wasm/w2c" >> "$GITHUB_ENV"

      - name: Save wasm2c (WABT)
        if: steps.fetch.outputs.ok == 'true' && steps.wabt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/wasm/wabt-build/wasm2c
            build/wasm/wabt-src/wasm2c
          key: wabt-1.0.36-ubuntu-24.04-v1

      - name: SDL2 source (pinned release)
        if: steps.fetch.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sdlsrc"
          curl -fsSL -o "$RUNNER_TEMP/sdlsrc/sdl.tar.gz" "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar xzf "$RUNNER_TEMP/sdlsrc/sdl.tar.gz" -C "$RUNNER_TEMP/sdlsrc"
          echo "SDL2_SOURCE=$RUNNER_TEMP/sdlsrc/SDL2-${SDL2_VERSION}" >> "$GITHUB_ENV"

      # The USA release (SCUS-94236) as a second game library, libtombi_usa.so for both ABIs (docs/PORT_VERSIONS_PLAN.md
      # U2, port2/android/game_libs.py): only with the GAME_FILES_URL_USA secret; without it the APK has the PAL game
      # only (the launcher then lists a USA disc as recognised but not in this build).  The generator takes the USA
      # addresses from its own matching build and the USA disc's files (game_usa/fs), as the PAL one does from game/.
      - name: USA game library (libtombi_usa.so, both ABIs)
        id: usa
        if: steps.fetch.outputs.ok == 'true'
        env:
          GAME_FILES_URL_USA: ${{ secrets.GAME_FILES_URL_USA }}
        run: |
          if [ -z "$GAME_FILES_URL_USA" ]; then
            echo "::notice::GAME_FILES_URL_USA secret not set; the APK has the PAL game only."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bash tools/disc_fetch.sh USA
          echo "81cbc79f0230aeb4252e058039f47ac95a777f5a  game_usa/fs/SCUS_942.36" | sha1sum -c -
          python3 tools/build_full.py --version usa -j "$(nproc)"
          python3 port2/android/game_libs.py --version usa --sdl2 "$SDL2_SOURCE" --ndk "$ANDROID_NDK_LATEST_HOME" -j "$(nproc)"
          ls -l port2/android/app/src/main/jniLibs/*/
          rm -f game_usa/disc.bin
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.fetch.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.fetch.outputs.ok == 'true'
        with:
          gradle-version: "8.5"

      # The launcher's fonts (SIL OFL 1.1), from google/fonts at a pinned commit; never committed (.gitignore)
      - name: Launcher fonts (Lilita One, Nunito; OFL)
        if: steps.fetch.outputs.ok == 'true'
        run: |
          GF=https://raw.githubusercontent.com/google/fonts/6c1dbe27dcf7d817d4b62cec033ba77fa8e2a5ec
          D=port2/android/app/src/main/assets/fonts; mkdir -p "$D"
          curl -fsSL -o "$D/LilitaOne-Regular.ttf" "$GF/ofl/lilitaone/LilitaOne-Regular.ttf"
          curl -fsSL -o "$D/LilitaOne-OFL.txt" "$GF/ofl/lilitaone/OFL.txt"
          curl -fsSL -o "$D/Nunito.ttf" "$GF/ofl/nunito/Nunito%5Bwght%5D.ttf"
          curl -fsSL -o "$D/Nunito-OFL.txt" "$GF/ofl/nunito/OFL.txt"
          ls -l "$D"

      # Text patches for --text-patch (our own translation text; the .tpatch twins carry no game data, tools/tpatch_build.py)
      - name: Bundle the text patches (assets/patches)
        if: steps.fetch.outputs.ok == 'true'
        run: |
          D=port2/android/app/src/main/assets/patches; mkdir -p "$D"
          cp patches/*.tombipatch.json patches/*.tpatch "$D/"
          ls -l "$D"

      - name: Build the APK (debug-signed)
        if: steps.fetch.outputs.ok == 'true'
        run: |
          export PORT2_PYTHON="$(command -v python3)"
          gradle -p port2/android assembleDebug --no-daemon --stacktrace -Psdl2Source="$SDL2_SOURCE"
          APK=port2/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E "\.so$"
          # both ABIs, all four libraries each (a 64-bit-only device loads only lib/arm64-v8a)
          LIBS="libtombi.so libmain.so libSDL2.so libtombidisc.so"
          [ "${{ steps.usa.outputs.ok }}" = "true" ] && LIBS="$LIBS libtombi_usa.so"   # the USA game library (game_libs.py)
          for abi in armeabi-v7a arm64-v8a; do for l in $LIBS; do
            unzip -l "$APK" | grep -q " lib/$abi/$l\$" || { echo "::error::the APK has no lib/$abi/$l"; exit 1; }
          done; done
          REP="$(find port2/android/app/.cxx -name report.txt -path '*gen*' | head -1)"
          [ -n "$REP" ] && head -12 "$REP"
          mkdir -p dist/android
          cp "$APK" dist/android/tombi-port-android-debug.apk
          # libtombi.so must take the C library's variables from bionic (a stub function named `stderr` made every
          # fprintf(stderr) fault in vfprintf: beta 35), and must keep its symbol table (the crash handler's names)
          unzip -o -q "$APK" lib/armeabi-v7a/libtombi.so -d "$RUNNER_TEMP/apklib"
          SO="$RUNNER_TEMP/apklib/lib/armeabi-v7a/libtombi.so"
          BAD="$(readelf -W --dyn-syms "$SO" | awk '$7 != "UND" && $8 ~ /^(stdin|stdout|stderr|environ|optarg|optind|opterr|optopt|__sF)$/ {print $8}')"
          if [ -n "$BAD" ]; then echo "::error::libtombi.so defines C library variables itself: $BAD"; exit 1; fi
          readelf -W --dyn-syms "$SO" | grep -wE "stderr|stdout" || true
          readelf -S "$SO" | grep -q "\.symtab" || { echo "::error::libtombi.so in the APK has no symbol table"; exit 1; }
          # symbols for offline symbolization of a device crash (llvm-addr2line -fe libtombi.debug.so 0xOFFSET)
          mkdir -p dist/android/symbols
          for abi in armeabi-v7a arm64-v8a; do
            DBG="$(find port2/android/app/.cxx -path "*$abi*" -name libtombi.debug.so | head -1)"
            if [ -n "$DBG" ]; then cp "$DBG" "dist/android/symbols/libtombi-$abi.debug.so"; fi
            DBG="build/android-usa/$abi/libtombi_usa.debug.so"
            if [ -f "$DBG" ]; then cp "$DBG" "dist/android/symbols/libtombi_usa-$abi.debug.so"; fi
          done
          nm -n --defined-only "$SO" > dist/android/symbols/libtombi-armeabi-v7a.map 2>/dev/null || true
          unzip -o -q "$APK" lib/arm64-v8a/libtombi.so -d "$RUNNER_TEMP/apklib"
          SO64="$RUNNER_TEMP/apklib/lib/arm64-v8a/libtombi.so"
          file "$SO64"
          readelf -W --dyn-syms "$SO64" | grep -wE "port_main|port_wasm_var_ptr" || { echo "::error::arm64 libtombi.so lacks port_main / port_wasm_var_ptr"; exit 1; }
          nm -n --defined-only "$SO64" > dist/android/symbols/libtombi-arm64-v8a.map 2>/dev/null || true
          ls -l dist/android/symbols
          cp "$SDL2_SOURCE/LICENSE.txt" dist/android/SDL2-LICENSE.txt
          cp port2/android/app/src/main/assets/fonts/*-OFL.txt dist/android/

      # Optional release signing; without the four secrets the APK stays debug-signed.  Never commit a keystore.
      - name: Sign with the release keystore (optional)
        if: steps.fetch.outputs.ok == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::notice::Android signing secrets not set; keeping the debug signature."; exit 0
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          A=dist/android/tombi-port-android-debug.apk
          "$BT/zipalign" -f -p 4 "$A" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/signed.apk"
          mv "$RUNNER_TEMP/signed.apk" "$A"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "signed=true" > dist/android/SIGNED.txt   # (not a dot file: upload-artifact leaves hidden files out)

      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.ok == 'true'
        with:
          name: tombi-port-android
          path: dist/android
          retention-days: 14

  publish:
    # BETA pre-release (never "Latest": the normal v0.0.N releases come from release.yml)
    if: inputs.publish == true
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tombi-port-android
          path: art

      - name: Create the pre-release
        run: |
          N=${{ github.run_number }}; SHA=${{ github.sha }}; TAG="android-beta-$N"
          APK="tombi-port-android-beta-$N.apk"
          mkdir out; cp art/tombi-port-android-debug.apk "out/$APK"
          if [ -f art/SIGNED.txt ]; then SIG="signed with the project release key"; else SIG="debug-signed: uninstall the old beta before installing a newer one"; fi
          {
            echo "**BETA $N** (build of ${SHA::7})."; echo
            echo "- Android port of Tombi!, one APK for 64-bit ARM (arm64-v8a: 64-bit-only devices such as Snapdragon 8 Gen 3 and newer, AYN Odin 2) and 32-bit ARM (armeabi-v7a); Android picks the right one."
            echo "- No game data included and no PC needed: pick your own disc image (.bin/.cue/.iso/.chd of the PAL SCES-01331) on the device from the Selva launcher; it is checked (MAIN0.EXE sha1) and its files are extracted into app storage (about 500 MB, every file checked; a truncated or damaged image is refused with the reason)."
            echo "- New: crash reports without adb: if the game closes unexpectedly the launcher shows the last lines of the log with Copy report / Share / Export log (also Options > View last log). Disc > Delete data removes the extracted data (saves kept unless ticked)."
            echo "- Launcher options: language, improved Spanish translation toggle (applied in memory, natively), debug menu, cut content, aspect (automatic by default), renderer, 60 Hz, cheats."
            echo "- New: progress bar while copying and checking the disc (percentage, MB, Cancel with B); .chd images (chdman createcd) are read natively, no conversion; a .cue whose FILE name does not match the copied .bin now works (second-screen names/map included); second-screen panel (map + status) for dual-screen handhelds (option Second screen)."
            echo "- Fixed: the game closed during the opening movie (SIGABRT: SDL/JNI called on a game task's stack) and right after New Game (SIGBUS: forwarded arguments read from the wrong place on ARM); signed betas install over the previous one (one last uninstall when coming from a debug-signed beta)."
            echo "- Fixed earlier: the game closed 0.1 s after starting (every log line of the game faulted in vfprintf: \`stderr\` was a stub instead of bionic's); crash reports now name the real function (symbol table kept in libtombi.so)."
            echo "- Extra flags in \`files/args.txt\`. APK is $SIG."
            echo "- Please report results with the log (launcher: Options > View last log > Share / Export log)."
          } > notes.md
          gh release create "$TAG" -R "$R" --target "$SHA" --title "Tombi! port – Android BETA $N (arm64-v8a + armeabi-v7a)" \
            --prerelease --latest=false --notes-file notes.md "out/$APK"
