name: Text editor (Windows exe)

# Builds tools/text_editor.py (dialogue editor with live preview, see README) into a single Windows executable with
# PyInstaller and publishes it as a release asset (was dist/windows/tombi-text.exe).  The exe bundles the mkpsxiso/dumpsxiso release binaries
# (Lameguy64/mkpsxiso, GPL-2.0, see THIRD_PARTY_NOTICES.md) so that "Generar ISO" works without installing anything.
on:
  push:
    branches: [master]
    paths:
      - tools/text_editor.py
      - tools/i18n.py
      - tools/text_strings.py
      - tools/text_core.py
      - tools/text_patch.py
      - tools/text_preview.py
      - tools/wfm_py.py
      - tools/title_layout.py
      - tools/wfm_charmap.json
      - tools/mkdisc.py
      - tools/icons/**
      - tools/cdfiles.py
      - tools/verb_order.py
      - .github/workflows/text-exe.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  MKPSXISO_VERSION: "2.30"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch mkpsxiso
        shell: bash
        run: |
          mkdir -p build/mk
          curl -fsSL -o build/mk/mkpsxiso.zip "https://github.com/Lameguy64/mkpsxiso/releases/download/v${MKPSXISO_VERSION}/mkpsxiso-${MKPSXISO_VERSION}-win64.zip"
          unzip -j -o build/mk/mkpsxiso.zip "*/mkpsxiso.exe" "*/dumpsxiso.exe" -d build/mk
          ls -l build/mk

      - name: Build
        shell: bash
        run: |
          python -m pip install pyinstaller pillow
          pyinstaller --onefile --windowed --name tombi-text --distpath build/exe --workpath build/pyi --specpath . \
            --hidden-import i18n --hidden-import text_strings --hidden-import wfm_py --hidden-import title_layout --hidden-import text_core --hidden-import text_patch --hidden-import text_preview --hidden-import mkdisc --hidden-import cdfiles --hidden-import verb_order --paths tools \
            --icon tools/icons/text.ico --add-data "tools/wfm_charmap.json;." --add-data "tools/icons/text.ico;icons" --add-data "tools/icons/text.png;icons" \
            --add-binary "build/mk/mkpsxiso.exe;." --add-binary "build/mk/dumpsxiso.exe;." tools/text_editor.py
          mkdir -p dist/windows
          cp build/exe/tombi-text.exe dist/windows/tombi-text.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh dist/windows/tombi-text.exe
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build mkpsxiso (Linux has no release binary)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build cmake
          git clone -q --recursive --depth 1 --branch v${MKPSXISO_VERSION} https://github.com/Lameguy64/mkpsxiso build/mksrc
          cmake -S build/mksrc -B build/mkb -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build/mkb
          mkdir -p build/mk && cp build/mkb/mkpsxiso build/mkb/dumpsxiso build/mk/
          ls -l build/mk

      - name: Build
        run: |
          python -c "import tkinter"
          python -m pip install pyinstaller pillow
          pyinstaller --onefile --windowed --name tombi-text --distpath build/exe --workpath build/pyi --specpath . \
            --hidden-import i18n --hidden-import text_strings --hidden-import wfm_py --hidden-import title_layout --hidden-import text_core --hidden-import text_patch --hidden-import text_preview --hidden-import mkdisc --hidden-import cdfiles --hidden-import verb_order --paths tools \
             --add-data "tools/wfm_charmap.json:." --add-data "tools/icons/text.ico:icons" --add-data "tools/icons/text.png:icons" \
            --add-binary "build/mk/mkpsxiso:." --add-binary "build/mk/dumpsxiso:." tools/text_editor.py
          mkdir -p dist/linux
          cp build/exe/tombi-text dist/linux/tombi-text
          chmod +x dist/linux/tombi-text

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh dist/linux/tombi-text
