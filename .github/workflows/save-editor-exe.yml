name: Save editor (Windows exe)

# Builds tools/tombi_save_editor.py (Tombi Save Editor, docs/SAVE_EDITOR.md) into one Windows executable with
# PyInstaller, like text-exe.yml.  Qt front end (PySide6-Essentials) + the OFL fonts in tools/save_editor_assets; no game
# data is bundled: item / event names and item icons are read from the user's disc at run time.
on:
  push:
    branches: [master]
    paths:
      - tools/tombi_save.py
      - tools/tombi_save_editor.py
      - tools/test_tombi_save.py
      - tools/test_tombi_save_editor.py
      - tools/save_editor_assets/**
      - tools/text_core.py
      - tools/wfm_py.py
      - tools/cdfiles.py
      - tools/i18n.py
      - tools/text_strings.py
      - .github/workflows/save-editor-exe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: python -m pip install "PySide6-Essentials==6.8.1" pyinstaller

      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/test_tombi_save.py
          python tools/test_tombi_save_editor.py

      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name TombiSaveEditor --distpath build/exe --workpath build/pyi --specpath . \
            --paths tools --hidden-import tombi_save --hidden-import text_core --hidden-import wfm_py --hidden-import cdfiles \
            --hidden-import i18n --hidden-import text_strings --hidden-import title_layout --hidden-import verb_order --hidden-import menu_text --hidden-import memcard_text --add-data "tools/wfm_charmap.json;." \
            --add-data "tools/save_editor_assets;save_editor_assets" \
            --exclude-module tkinter --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtPdf \
            tools/tombi_save_editor.py
          mkdir -p dist/windows
          cp build/exe/TombiSaveEditor.exe dist/windows/TombiSaveEditor.exe
          ls -l dist/windows/TombiSaveEditor.exe
          echo "exe size: $(( $(stat -c %s dist/windows/TombiSaveEditor.exe) / 1048576 )) MB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows-save-editor
          path: dist/windows/TombiSaveEditor.exe
          retention-days: 90
