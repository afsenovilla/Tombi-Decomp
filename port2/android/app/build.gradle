// The app is SDL2's android-project (SDLActivity + SDL_main) around the CMake project of port2/:
// libmain.so (port2/android/loader.c) loads the game, libtombi.so (armeabi-v7a: below 16 MB; arm64-v8a: the wasm2c build)
// (docs/PORT.md "4. Android").
plugins { id 'com.android.application' }

def sdl2Source = project.findProperty('sdl2Source') ?: System.getenv('SDL2_SOURCE')
if (!sdl2Source) throw new GradleException("-Psdl2Source=DIR (an SDL2 2.30.x source tree) is required")

android {
    namespace 'io.github.tombi.port'
    compileSdk 34
    def ndkDir = System.getenv('ANDROID_NDK_LATEST_HOME') ?: System.getenv('ANDROID_NDK_HOME')
    if (ndkDir) { ndkPath ndkDir; ndkVersion new File(ndkDir).name }

    defaultConfig {
        applicationId 'io.github.tombi.port'
        minSdk 23                      // android_dlopen_ext (21+); 23: the oldest level recent NDKs target
        targetSdk 34
        // every CI build a higher versionCode, so a newer beta installs over the old one (same signing key needed too)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        // the release number shown by the launcher: VERSION at the repo root (release.yml publishes that number)
        versionName rootProject.file('../../VERSION').text.trim()
        // both ABIs in one APK: armeabi-v7a is the native 32-bit build, arm64-v8a the wasm2c build (docs/PORT.md "64-bit
        // builds: wasm2c"; needs port2/wasm/build.py --until w2c first, PORT2_W2C_DIR); 64-bit-only devices (Snapdragon 8
        // Gen 3+, AYN Odin 2 ...) install it and load the arm64 libraries
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DPORT2_SDL2_SOURCE=${sdl2Source}", '-DANDROID_STL=c++_static'
                // the generator (port2/tools/gen2.py) runs on the host Python with tools/requirements.txt installed
                if (System.getenv('PORT2_PYTHON')) arguments "-DPython3_EXECUTABLE=${System.getenv('PORT2_PYTHON')}"
                if (System.getenv('PORT2_W2C_DIR')) arguments "-DPORT2_W2C_DIR=${System.getenv('PORT2_W2C_DIR')}"
                targets 'main', 'tombi2', 'SDL2', 'tombidisc'
            }
        }
    }
    buildTypes {
        debug { jniDebuggable true }
    }
    externalNativeBuild {
        cmake { path '../../CMakeLists.txt' }
    }
    sourceSets {
        main { java.srcDirs += ["${sdl2Source}/android-project/app/src/main/java"] }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true   // extracted: android_dlopen_ext opens libtombi.so by name
            // unstripped symbol table (its DWARF is already gone, port2/CMakeLists.txt): the crash handler of
            // loader.c names static runtime functions too, not only the exported / game ones
            // (libtombi_usa.so ...: the other versions' game libraries, port2/android/game_libs.py, in src/main/jniLibs)
            keepDebugSymbols += ['**/libtombi.so', '**/libtombi_*.so']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false }
}
