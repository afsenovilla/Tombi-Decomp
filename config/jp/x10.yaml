# Japanese retail release (SLPS-01144), area overlay X10.BIN (copies in SYSTEM/ and AREA10/ are identical).
# The first 0x2B680 bytes are the X00.BIN code every overlay repeats (split in config/jp/x00.yaml); the area part
# starts at 0x2B680 (ID word + entry table, then code), load address 0x800E9AF8 for the whole file.
name: X10.BIN
sha1: e9280e20362a1be59df924bc4be2f769438d6ae7
options:
  basename: x10
  target_path: game_jp/SYSTEM/X10.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/jp/x10
  src_path: build/jp/splat_src/x10
  build_path: build/jp
  asset_path: build/jp/assets
  ld_script_path: build/jp/x10.ld
  symbol_addrs_path:
    - config/jp/symbol_addrs_x10.txt
  undefined_funcs_auto_path: build/jp/undefined_funcs_auto.x10.txt
  undefined_syms_auto_path: build/jp/undefined_syms_auto.x10.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - [0x0, bin, x10_shared]
  - name: x10
    type: code
    start: 0x2B680
    vram: 0x80115178
    align: 4
    subalign: 4
    subsegments:
      - [0x2B680, c, x10]
  - [0x454DC]
