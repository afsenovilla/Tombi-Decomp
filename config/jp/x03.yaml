# Japanese retail release (SLPS-01144), area overlay X03.BIN (copies in SYSTEM/ and AREA03/ are identical).
# The first 0x2B680 bytes are the X00.BIN code every overlay repeats (split in config/jp/x00.yaml); the area part
# starts at 0x2B680 (ID word + entry table, then code), load address 0x800E9AF8 for the whole file.
name: X03.BIN
sha1: 3dc9bb3c227130067137411610a6240a4cb6ebfa
options:
  basename: x03
  target_path: game_jp/SYSTEM/X03.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/jp/x03
  src_path: build/jp/splat_src/x03
  build_path: build/jp
  asset_path: build/jp/assets
  ld_script_path: build/jp/x03.ld
  symbol_addrs_path:
    - config/jp/symbol_addrs_x03.txt
  undefined_funcs_auto_path: build/jp/undefined_funcs_auto.x03.txt
  undefined_syms_auto_path: build/jp/undefined_syms_auto.x03.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - [0x0, bin, x03_shared]
  - name: x03
    type: code
    start: 0x2B680
    vram: 0x80115178
    align: 4
    subalign: 4
    subsegments:
      - [0x2B680, c, x03]
  - [0x4DD54]
