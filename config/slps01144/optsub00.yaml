# Japanese retail release (SLPS-01144), SYSTEM code overlay OPTSUB00.BIN (PAL O0PTSUB0.BIN, config/o0ptsub0.yaml).
# Raw blob loaded at the overlay base 0x800E9AF8: ID word (no entry table), code 0x4..0xD84, then data.
name: OPTSUB00.BIN
sha1: 05dcd16b723afd6739361fd1fd756e09acf683d6
options:
  basename: optsub00
  target_path: game_jp/SYSTEM/OPTSUB00.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/slps01144/optsub00
  src_path: build/slps01144/splat_src/optsub00
  build_path: build/slps01144
  asset_path: build/slps01144/assets
  ld_script_path: build/slps01144/optsub00.ld
  symbol_addrs_path:
    - config/slps01144/symbol_addrs_optsub00.txt
  undefined_funcs_auto_path: build/slps01144/undefined_funcs_auto.optsub00.txt
  undefined_syms_auto_path: build/slps01144/undefined_syms_auto.optsub00.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - name: optsub00
    type: code
    start: 0x0
    vram: 0x800E9AF8
    align: 4
    subalign: 4
    subsegments:
      - [0x0, bin, optsub00_header]
      - [0x4, c, optsub00]
      - [0xD84, bin, optsub00_data]
  - [0x148C]
