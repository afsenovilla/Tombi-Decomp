# Japanese retail release (SLPS-01144), SYSTEM code overlay INFO3.BIN (PAL I0NFO3.BIN, config/i0nfo3.yaml).
# Raw blob loaded at the overlay base 0x800E9AF8: ID word + entry table (data), code 0x414..0x679C, then data.
name: INFO3.BIN
sha1: c5284a56eaa9846752d8ade2a37b2dacbd3842a5
options:
  basename: info3
  target_path: game_jp/SYSTEM/INFO3.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/slps01144/info3
  src_path: build/slps01144/splat_src/info3
  build_path: build/slps01144
  asset_path: build/slps01144/assets
  ld_script_path: build/slps01144/info3.ld
  symbol_addrs_path:
    - config/slps01144/symbol_addrs_info3.txt
  undefined_funcs_auto_path: build/slps01144/undefined_funcs_auto.info3.txt
  undefined_syms_auto_path: build/slps01144/undefined_syms_auto.info3.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - name: info3
    type: code
    start: 0x0
    vram: 0x800E9AF8
    align: 4
    subalign: 4
    subsegments:
      - [0x0, bin, info3_header]
      - [0x414, c, info3]
      - [0x679C, bin, info3_data]
  - [0x6ECC]
