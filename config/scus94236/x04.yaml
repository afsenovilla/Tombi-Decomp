# USA retail release (SCUS-94236), area overlay X04.BIN.
# The first 0x2DE6C bytes are the X00.BIN code every overlay repeats (split in config/scus94236/x00.yaml); the area part
# starts at 0x2DE6C (ID word + entry table, then code), load address 0x800E7388 for the whole file.
name: X04.BIN
sha1: 84cf422f1e5b1fae0d4e2696547eb7fd2eb0633a
options:
  basename: x04
  target_path: game_usa/fs/SYSTEM/X04.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/scus94236/x04
  src_path: build/scus94236/splat_src/x04
  build_path: build/scus94236
  asset_path: build/scus94236/assets
  ld_script_path: build/scus94236/x04.ld
  symbol_addrs_path:
    - config/scus94236/symbol_addrs_x04.txt
  undefined_funcs_auto_path: build/scus94236/undefined_funcs_auto.x04.txt
  undefined_syms_auto_path: build/scus94236/undefined_syms_auto.x04.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - [0x0, bin, x04_shared]
  - name: x04
    type: code
    start: 0x2DE6C
    vram: 0x801151F4
    align: 4
    subalign: 4
    subsegments:
      - [0x2DE6C, c, x04]
  - [0x4DA90]
