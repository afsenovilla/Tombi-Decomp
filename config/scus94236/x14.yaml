# USA retail release (SCUS-94236), area overlay X14.BIN.
# The first 0x2DE6C bytes are the X00.BIN code every overlay repeats (split in config/scus94236/x00.yaml); the area part
# starts at 0x2DE6C (ID word + entry table, then code), load address 0x800E7388 for the whole file.
name: X14.BIN
sha1: b65ccce92f2d2ad0a033cf49da53ea7f89989e4c
options:
  basename: x14
  target_path: game_usa/fs/SYSTEM/X14.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/scus94236/x14
  src_path: build/scus94236/splat_src/x14
  build_path: build/scus94236
  asset_path: build/scus94236/assets
  ld_script_path: build/scus94236/x14.ld
  symbol_addrs_path:
    - config/scus94236/symbol_addrs_x14.txt
  undefined_funcs_auto_path: build/scus94236/undefined_funcs_auto.x14.txt
  undefined_syms_auto_path: build/scus94236/undefined_syms_auto.x14.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - [0x0, bin, x14_shared]
  - name: x14
    type: code
    start: 0x2DE6C
    vram: 0x801151F4
    align: 4
    subalign: 4
    subsegments:
      - [0x2DE6C, c, x14]
  - [0x427C8]
