# USA retail release (SCUS-94236), area overlay X11.BIN.
# The first 0x2DE6C bytes are the X00.BIN code every overlay repeats (split in config/scus94236/x00.yaml); the area part
# starts at 0x2DE6C (ID word + entry table, then code), load address 0x800E7388 for the whole file.
name: X11.BIN
sha1: 60680209f06fb6e364737b05cb96b55764607c11
options:
  basename: x11
  target_path: game_usa/fs/SYSTEM/X11.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/scus94236/x11
  src_path: build/scus94236/splat_src/x11
  build_path: build/scus94236
  asset_path: build/scus94236/assets
  ld_script_path: build/scus94236/x11.ld
  symbol_addrs_path:
    - config/scus94236/symbol_addrs_x11.txt
  undefined_funcs_auto_path: build/scus94236/undefined_funcs_auto.x11.txt
  undefined_syms_auto_path: build/scus94236/undefined_syms_auto.x11.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - [0x0, bin, x11_shared]
  - name: x11
    type: code
    start: 0x2DE6C
    vram: 0x801151F4
    align: 4
    subalign: 4
    subsegments:
      - [0x2DE6C, c, x11]
  - [0x346D4]
