# USA retail release (SCUS-94236), SYSTEM code overlay DSPSUB.BIN (PAL D0SPSUB.BIN, config/d0spsub.yaml).
# Raw blob loaded at the overlay base 0x800E7388: ID word + entry table (data), code 0x794..0x962C, then data.
name: DSPSUB.BIN
sha1: bac75e42796b308f34ee7279ae5ffc8884c04bee
options:
  basename: dspsub
  target_path: game_usa/fs/SYSTEM/DSPSUB.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/scus94236/dspsub
  src_path: build/scus94236/splat_src/dspsub
  build_path: build/scus94236
  asset_path: build/scus94236/assets
  ld_script_path: build/scus94236/dspsub.ld
  symbol_addrs_path:
    - config/scus94236/symbol_addrs_dspsub.txt
  undefined_funcs_auto_path: build/scus94236/undefined_funcs_auto.dspsub.txt
  undefined_syms_auto_path: build/scus94236/undefined_syms_auto.dspsub.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - name: dspsub
    type: code
    start: 0x0
    vram: 0x800E7388
    align: 4
    subalign: 4
    subsegments:
      - [0x0, bin, dspsub_header]
      - [0x794, c, dspsub]
      - [0x962C, bin, dspsub_data]
  - [0x28F9C]
