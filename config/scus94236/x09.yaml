# starts at 0x2DE6C (ID word + entry table, then code), load address 0x800E7388 for the whole file.
name: X09.BIN
sha1: 0081fbea9136c4864e7f0e4f4121e5ec73b9236f
options:
  basename: x09
  target_path: game_usa/fs/SYSTEM/X09.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/scus94236/x09
  src_path: build/scus94236/splat_src/x09
  build_path: build/scus94236
  asset_path: build/scus94236/assets
  ld_script_path: build/scus94236/x09.ld
  symbol_addrs_path:
    - config/scus94236/symbol_addrs_x09.txt
  undefined_funcs_auto_path: build/scus94236/undefined_funcs_auto.x09.txt
  undefined_syms_auto_path: build/scus94236/undefined_syms_auto.x09.txt
  find_file_boundaries: False
  disassemble_all: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  subalign: 4
  string_encoding: ASCII
segments:
  - [0x0, bin, x09_shared]
